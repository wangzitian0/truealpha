# Virtual workspace root — not a package itself.
# Python members share one lockfile (uv.lock) and one .venv at the repo root.

[tool.uv.workspace]
members = [
    "apps/data-engine",
    "apps/llm-service",
    "common/contracts",
    "common/factors",
    "common/runtime",
]

[dependency-groups]
dev = [
    "truealpha-runtime",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
]

[tool.uv.sources]
truealpha-runtime = { workspace = true }

[tool.mypy]
python_version = "3.12"
files = [
    "apps/data-engine/src",
    "apps/data-engine/scripts",
    "apps/llm-service/src",
    "apps/llm-service/scripts",
    "common/contracts/src",
    "common/factors/src",
    "common/runtime/src",
]

# Only these ship no stubs (moomoo SDK; boto3/botocore's dynamic clients).
# infra2_sdk ships a py.typed marker since 2.4.0, so mypy checks it and it needs no entry.
# Scoped per-module so a typo'd or missing dependency still fails the check.
# mypy's `foo.*` matches `foo` itself too; bare names listed anyway so the
# intent survives a reader who doesn't know that.
[[tool.mypy.overrides]]
module = [
    "moomoo",
    "moomoo.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "apps/data-engine/tests",
    "apps/llm-service/tests",
    "common/contracts/tests",
    "common/factors/tests",
    "common/runtime/tests",
]
markers = [
    "gate: Class 1 hard merge, security, or boundary gate",
    "deps: Class 2 real external dependency test (Postgres, S3, migrations, roles)",
    "smoke: Class 2 live runtime, HTTP, MCP, or container smoke test",
    "contract: Class 2 schema, OpenAPI, environment, or serialization contract test",
    "logic: Class 4 pure business-logic test",
]
