x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: truealpha-postgres${ENV_SUFFIX:-}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-truealpha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/truealpha-db:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/00_truealpha.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-truealpha}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [runtime]

  s3:
    # The same S3 engine as the infra2 platform service (platform/03.s3: RustFS 1.0.0).
    # Multi-arch index digest. The app creates its bucket (`make runtime-up`).
    image: docker.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: truealpha-s3${ENV_SUFFIX:-}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-s3local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-s3_local_secret}
    command: ["--address", ":9000", "/data"]
    volumes:
      - s3_data:/data
    ports:
      - "${S3_API_PORTS:-127.0.0.1:9000:9000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [runtime]

  llm-service:
    build:
      context: .
      dockerfile: apps/llm-service/Dockerfile
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-wangzitian0/truealpha}-llm-service:${SERVICE_VERSION:-local}
    container_name: truealpha-llm${ENV_SUFFIX:-}
    profiles: [app]
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-truealpha}
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3_local_secret}
      S3_BUCKET: ${S3_BUCKET:-truealpha-raw}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_DOCUMENTS_PREFIX: ${S3_DOCUMENTS_PREFIX:-documents}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports:
      - "${LLM_PORTS:-127.0.0.1:8000:8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [runtime]

  app-web:
    build:
      context: apps/app-web
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-wangzitian0/truealpha}-app-web:${SERVICE_VERSION:-local}
    container_name: truealpha-web${ENV_SUFFIX:-}
    profiles: [app]
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      LLM_SERVICE_URL: http://llm-service:8000
    depends_on:
      llm-service:
        condition: service_healthy
    ports:
      - "${WEB_PORTS:-127.0.0.1:3000:3000}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [runtime]

volumes:
  postgres_data:
  s3_data:

networks:
  runtime:
