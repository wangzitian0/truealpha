name: Deploy release

run-name: Deploy ${{ inputs.deploy_type }} ${{ inputs.version_ref }}

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: Immutable release promotion target.
        required: true
        type: choice
        options: [preview/tag, staging, prod]
      version_ref:
        description: Stable vX.Y.Z release tag.
        required: true
        type: string
      source_run_id:
        description: Successful tag ci-required run id for this release.
        required: true
        type: string
      staging_run_url:
        description: Required for prod; this repo's own successful "Deploy staging <tag>" run URL.
        required: false
        type: string
      reviewed_change_url:
        description: Required for prod; merged PR whose merge commit is the release SHA.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: truealpha-release-${{ inputs.deploy_type }}-${{ inputs.version_ref }}
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install the pinned SDK contract
        run: uv sync --frozen --only-group dev --no-install-workspace
      - name: Verify release evidence and render request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
          VERSION_REF: ${{ inputs.version_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          STAGING_RUN_URL: ${{ inputs.staging_run_url }}
          REVIEWED_CHANGE_URL: ${{ inputs.reviewed_change_url }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::release requests must run from main"
            exit 1
          fi
          if ! [[ "$VERSION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_ref must be a stable vX.Y.Z tag"
            exit 1
          fi
          request_id="truealpha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! git rev-parse --verify --quiet "refs/tags/${VERSION_REF}^{commit}" >/dev/null; then
            echo "::error::version_ref must identify an existing commit tag"
            exit 1
          fi
          source_sha="$(git rev-list -n 1 "refs/tags/${VERSION_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::release tag must be reachable from origin/main"
            exit 1
          fi
          if [[ "$DEPLOY_TYPE" == "prod" ]]; then
            if ! [[ "$REVIEWED_CHANGE_URL" =~ ^https://github.com/wangzitian0/truealpha/pull/([1-9][0-9]*)$ ]]; then
              echo "::error::reviewed_change_url must identify a TrueAlpha pull request"
              exit 1
            fi
            reviewed_pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${BASH_REMATCH[1]}")"
            jq -e --arg sha "$source_sha" \
              '.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha' \
              <<<"$reviewed_pr" >/dev/null || {
                echo "::error::reviewed change must be merged to main at the release SHA"
                exit 1
              }
          fi
          source_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e \
            --arg sha "$source_sha" \
            --arg tag "$VERSION_REF" \
            '.conclusion == "success" and .head_sha == $sha and .head_branch == $tag
             and .event == "push" and .path == ".github/workflows/ci-required.yml"' \
            <<<"$run_json" >/dev/null || {
              echo "::error::source run must be a successful exact-tag run"
              exit 1
            }
          request="$(uv run --no-sync python tools/app_deploy_request.py \
            --request-id "$request_id" \
            --deploy-type "$DEPLOY_TYPE" \
            --version-ref "$VERSION_REF" \
            --source-sha "$source_sha" \
            --source-run-url "$source_run_url" \
            --source-run-id "$SOURCE_RUN_ID" \
            --staging-run-url "$STAGING_RUN_URL" \
            --reviewed-change-url "$REVIEWED_CHANGE_URL")"
          jq . <<<"$request"
          {
            echo 'json<<EOF'
            echo "$request"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Dispatch the validated request to infra2
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          INFRA2_PAT: ${{ secrets.INFRA2_PAT }}
          REQUEST_JSON: ${{ steps.request.outputs.json }}
        run: |
          set -euo pipefail
          if [[ -z "${INFRA2_PAT:-}" ]]; then
            echo "::error::INFRA2_PAT is required"
            exit 1
          fi
          deploy_type="$(jq -r '.deploy_type' <<<"$REQUEST_JSON")"
          version_ref="$(jq -r '.version_ref' <<<"$REQUEST_JSON")"
          source_sha="$(jq -r '.source_sha' <<<"$REQUEST_JSON")"
          if [[ "$deploy_type" == "prod" ]]; then
            # infra2#571 blocker 2: this check used to require an INFRA2 receiver-run
            # URL while infra2's verify_production_evidence requires OUR OWN staging
            # run — the two sides contradicted each other and prod failed in both
            # directions. infra2's expectation is correct by construction (a receiver
            # run is repository_dispatch-triggered, never workflow_dispatch): staging
            # evidence is this workflow's own successful "Deploy staging <tag>" run,
            # which itself polled the infra2 receiver to completion before
            # succeeding. The expectations asserted here (path/event/title) are the
            # SAME facts tools/production_evidence_policy.json declares (#464).
            staging_run_url="$(jq -r '.evidence.staging_run_url' <<<"$REQUEST_JSON")"
            if ! [[ "$staging_run_url" =~ ^https://github.com/wangzitian0/truealpha/actions/runs/([1-9][0-9]*)$ ]]; then
              echo "::error::staging evidence must identify this repo's own Deploy staging run"
              exit 1
            fi
            staging_run="$(gh api "/repos/wangzitian0/truealpha/actions/runs/${BASH_REMATCH[1]}")"
            expected_staging_title="Deploy staging ${version_ref}"
            jq -e --arg title "$expected_staging_title" \
              '.conclusion == "success"
               and .event == "workflow_dispatch"
               and .path == ".github/workflows/deploy-release.yml"
               and .display_title == $title' \
              <<<"$staging_run" >/dev/null || {
                echo "::error::staging receipt must be this repo's successful 'Deploy staging ${version_ref}' run"
                exit 1
              }
          fi

          # infra2#508: watermark/ambiguity-guard/log-content-verification dispatch
          # (the properties the previous inline title-match `first(...)` lookup here
          # did not have) now lives in infra2_sdk.dispatch, shared with finance_report.
          result="$(echo "$REQUEST_JSON" | uv run --no-sync python tools/app_deploy_transport.py \
            --timeout 1800 --poll-interval 5)"
          jq . <<<"$result"
          receiver_run_url="$(jq -r '.receiver_run_url' <<<"$result")"
          {
            echo "### infra2 deployment receipt"
            echo
            echo "- Environment: \`${deploy_type}\`"
            echo "- Release: \`${version_ref}\` (\`${source_sha}\`)"
            echo "- Receiver: ${receiver_run_url}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Confirm the deployed release is healthy
        if: ${{ inputs.deploy_type == 'prod' }}
        env:
          EXPECTED_SHA: ${{ fromJson(steps.request.outputs.json).source_sha }}
        run: |
          set -euo pipefail
          # infra2#508: llm-service's /health (reached through Traefik's /api prefix
          # route, tools/route_manifest.json) now reports git_sha, so this confirms
          # the deployed release is actually live -- not just that something answers.
          # Staging has no stable public URL yet (#11); scoped to prod only for now.
          uv run --no-sync python tools/health_check.py \
            "https://truealpha.club/api/health" \
            "$EXPECTED_SHA" \
            24
