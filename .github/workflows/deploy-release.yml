name: Deploy release

run-name: Deploy ${{ inputs.deploy_type }} ${{ inputs.version_ref }}

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: Immutable release promotion target.
        required: true
        type: choice
        options: [preview/tag, staging, prod]
      version_ref:
        description: Stable vX.Y.Z release tag.
        required: true
        type: string
      source_run_id:
        description: Optional override — derived from the tag when blank.
        required: false
        type: string
      staging_run_url:
        description: Optional override — derived from this tag's successful staging deploy when blank.
        required: false
        type: string
      reviewed_change_url:
        description: Optional override — derived from the PR whose merge commit is the release SHA when blank.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: truealpha-release-${{ inputs.deploy_type }}-${{ inputs.version_ref }}
  cancel-in-progress: false

jobs:
  request:
    permissions:
      actions: write   # save the Playwright cache; read-only cannot populate it
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install the pinned SDK contract and the workspace
        # --all-packages, not --no-install-workspace: three later steps run
        # tools/*.py that import `truealpha_runtime`, and #585 moved the shared
        # "what release is this environment serving" read into that workspace
        # package. With the workspace excluded, `Confirm the deployed release is
        # healthy` died at IMPORT time on the v0.0.22 production deploy —
        # before it read or compared anything — and the surface walk was skipped
        # as a consequence, so that release went out with no walk evidence
        # (#616). --frozen still pins the SDK contract: verified that
        # infra2-sdk resolves to 1.0.0 and uv.lock is unchanged.
        run: uv sync --frozen --all-packages
      - name: Verify release evidence and render request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
          VERSION_REF: ${{ inputs.version_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          STAGING_RUN_URL: ${{ inputs.staging_run_url }}
          REVIEWED_CHANGE_URL: ${{ inputs.reviewed_change_url }}
        run: |
          set -euo pipefail
          # The three evidence values are DERIVED, not pasted. Each is a fact GitHub
          # already holds about this tag, so asking a human to look them up and paste them
          # only creates a way to be wrong: 2 of the last 12 deploys died in under a
          # minute on "reviewed change must be merged to main at the release SHA" -- half
          # of all deploy failures, and neither was a real problem with the release. It
          # also caused #613, where two concurrent deploys could not each obtain a
          # receipt and prod deadlocked for both lanes.
          #
          # Inputs still WIN when supplied, so an operator can override a derivation that
          # is wrong; empty means "work it out". The verification below is unchanged and
          # still runs against whatever value is used -- derivation removes the typing,
          # not the proof.
          tag_sha="$(git rev-list -n 1 "refs/tags/${VERSION_REF}^{commit}" 2>/dev/null || true)"
          if [[ -z "${SOURCE_RUN_ID}" && -n "$tag_sha" ]]; then
            SOURCE_RUN_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=${VERSION_REF}" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$tag_sha\" and .conclusion == \"success\"
                     and .path == \".github/workflows/ci-required.yml\")] | first | .id // empty")"
            echo "derived source_run_id=${SOURCE_RUN_ID:-<none>}"
          fi
          if [[ -z "${REVIEWED_CHANGE_URL}" && "$DEPLOY_TYPE" == "prod" && -n "$tag_sha" ]]; then
            pr="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${tag_sha}/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"main\"
                     and .merge_commit_sha == \"$tag_sha\")] | first | .number // empty")"
            [[ -n "$pr" ]] && REVIEWED_CHANGE_URL="https://github.com/${GITHUB_REPOSITORY}/pull/${pr}"
            echo "derived reviewed_change_url=${REVIEWED_CHANGE_URL:-<none>}"
          fi
          if [[ -z "${STAGING_RUN_URL}" && "$DEPLOY_TYPE" == "prod" ]]; then
            # Derives what the operator used to paste by hand, and the requirement is
            # unchanged: this repo's own successful "Deploy staging <tag>" run URL.
            # Never an infra2 receiver run (infra2#571
            # blocker 2), which is why the query is scoped to GITHUB_REPOSITORY and matched
            # on this workflow's own run name. #613: two concurrent staging deploys can both
            # report failure while both actually succeed, so the newest SUCCESSFUL run is
            # the honest source rather than simply the newest.
            staging_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch" \
              --jq "[.workflow_runs[] | select(.name == \"Deploy staging ${VERSION_REF}\"
                     and .conclusion == \"success\")] | first | .id // empty")"
            [[ -n "$staging_id" ]] && STAGING_RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${staging_id}"
            echo "derived staging_run_url=${STAGING_RUN_URL:-<none>}"
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::release requests must run from main"
            exit 1
          fi
          if ! [[ "$VERSION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_ref must be a stable vX.Y.Z tag"
            exit 1
          fi
          request_id="truealpha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! git rev-parse --verify --quiet "refs/tags/${VERSION_REF}^{commit}" >/dev/null; then
            echo "::error::version_ref must identify an existing commit tag"
            exit 1
          fi
          source_sha="$(git rev-list -n 1 "refs/tags/${VERSION_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::release tag must be reachable from origin/main"
            exit 1
          fi
          if [[ "$DEPLOY_TYPE" == "prod" ]]; then
            if ! [[ "$REVIEWED_CHANGE_URL" =~ ^https://github.com/wangzitian0/truealpha/pull/([1-9][0-9]*)$ ]]; then
              echo "::error::reviewed_change_url must identify a TrueAlpha pull request"
              exit 1
            fi
            reviewed_pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${BASH_REMATCH[1]}")"
            jq -e --arg sha "$source_sha" \
              '.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha' \
              <<<"$reviewed_pr" >/dev/null || {
                echo "::error::reviewed change must be merged to main at the release SHA"
                exit 1
              }
          fi
          source_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e \
            --arg sha "$source_sha" \
            --arg tag "$VERSION_REF" \
            '.conclusion == "success" and .head_sha == $sha and .head_branch == $tag
             and .event == "push" and .path == ".github/workflows/ci-required.yml"' \
            <<<"$run_json" >/dev/null || {
              echo "::error::source run must be a successful exact-tag run"
              exit 1
            }
          request="$(uv run --no-sync python tools/app_deploy_request.py \
            --request-id "$request_id" \
            --deploy-type "$DEPLOY_TYPE" \
            --version-ref "$VERSION_REF" \
            --source-sha "$source_sha" \
            --source-run-url "$source_run_url" \
            --source-run-id "$SOURCE_RUN_ID" \
            --staging-run-url "$STAGING_RUN_URL" \
            --reviewed-change-url "$REVIEWED_CHANGE_URL")"
          jq . <<<"$request"
          {
            echo 'json<<EOF'
            echo "$request"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Dispatch the validated request to infra2
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          INFRA2_PAT: ${{ secrets.INFRA2_PAT }}
          REQUEST_JSON: ${{ steps.request.outputs.json }}
        run: |
          set -euo pipefail
          if [[ -z "${INFRA2_PAT:-}" ]]; then
            echo "::error::INFRA2_PAT is required"
            exit 1
          fi
          deploy_type="$(jq -r '.deploy_type' <<<"$REQUEST_JSON")"
          version_ref="$(jq -r '.version_ref' <<<"$REQUEST_JSON")"
          source_sha="$(jq -r '.source_sha' <<<"$REQUEST_JSON")"
          if [[ "$deploy_type" == "prod" ]]; then
            # infra2#571 blocker 2: this check used to require an INFRA2 receiver-run
            # URL while infra2's verify_production_evidence requires OUR OWN staging
            # run — the two sides contradicted each other and prod failed in both
            # directions. infra2's expectation is correct by construction (a receiver
            # run is repository_dispatch-triggered, never workflow_dispatch): staging
            # evidence is this workflow's own successful "Deploy staging <tag>" run,
            # which itself polled the infra2 receiver to completion before
            # succeeding. The expectations asserted here (path/event/title) are the
            # SAME facts tools/production_evidence_policy.json declares (#464).
            staging_run_url="$(jq -r '.evidence.staging_run_url' <<<"$REQUEST_JSON")"
            if ! [[ "$staging_run_url" =~ ^https://github.com/wangzitian0/truealpha/actions/runs/([1-9][0-9]*)$ ]]; then
              echo "::error::staging evidence must identify this repo's own Deploy staging run"
              exit 1
            fi
            staging_run="$(gh api "/repos/wangzitian0/truealpha/actions/runs/${BASH_REMATCH[1]}")"
            expected_staging_title="Deploy staging ${version_ref}"
            jq -e --arg title "$expected_staging_title" \
              '.conclusion == "success"
               and .event == "workflow_dispatch"
               and .path == ".github/workflows/deploy-release.yml"
               and .display_title == $title' \
              <<<"$staging_run" >/dev/null || {
                echo "::error::staging receipt must be this repo's successful 'Deploy staging ${version_ref}' run"
                exit 1
              }
          fi

          # infra2#508: watermark/ambiguity-guard/log-content-verification dispatch
          # (the properties the previous inline title-match `first(...)` lookup here
          # did not have) now lives in infra2_sdk.dispatch, shared with finance_report.
          result="$(echo "$REQUEST_JSON" | uv run --no-sync python tools/app_deploy_transport.py \
            --timeout 1800 --poll-interval 5)"
          jq . <<<"$result"
          receiver_run_url="$(jq -r '.receiver_run_url' <<<"$result")"
          {
            echo "### infra2 deployment receipt"
            echo
            echo "- Environment: \`${deploy_type}\`"
            echo "- Release: \`${version_ref}\` (\`${source_sha}\`)"
            echo "- Receiver: ${receiver_run_url}"
          } >>"$GITHUB_STEP_SUMMARY"

      # #526: this compared `source_sha` (a 40-hex commit sha) against what the
      # runtime reports, which the deployers set to the release TAG — two kinds
      # of identifier that can never compare equal, so EVERY prod release
      # recorded as FAILURE while actually deploying fine. Pass the release ref,
      # which is what the runtime actually reports; tools/health_check.py now
      # fails immediately and says so if the two sides ever disagree in kind
      # again, instead of exhausting a 24-attempt budget on an impossible match.
      # The surface walk below runs for BOTH environments, so bun is not gated
      # on deploy_type the way the prod-only health confirmation is.
      - uses: oven-sh/setup-bun@v2
      - name: Confirm the deployed release is healthy
        # json != '' belongs in the condition AND the env stays guarded: the
        # v0.0.34 incident showed step env templates are evaluated even when the
        # implicit success() condition is false, so an unguarded fromJson('')
        # errors on every failure path regardless of `if`. The guard alone is
        # not enough either — health_check.py treats an empty expected version
        # as "don't verify identity" (review), hence the assert in the script.
        if: ${{ inputs.deploy_type == 'prod' && steps.request.outputs.json != '' }}
        env:
          EXPECTED_RELEASE: ${{ steps.request.outputs.json != '' && fromJson(steps.request.outputs.json).version_ref || '' }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_RELEASE" ]; then
            echo "::error::request step produced no version_ref — refusing a vacuous health confirmation"
            exit 1
          fi
          # infra2#508: llm-service's /health (reached through Traefik's /api prefix
          # route, tools/route_manifest.json) now reports git_sha, so this confirms
          # the deployed release is actually live -- not just that something answers.
          # Staging has no stable public URL yet (#11); scoped to prod only for now.
          # The job's env is dev-group-only (--no-install-workspace, line ~49), but
          # health_check.py imports truealpha_runtime.deployed_release — every prod
          # release since that import has FAILED at this step on ModuleNotFoundError
          # while the deploy itself succeeded (v0.0.22 runs 32033840681/32035117182:
          # the web shipped, the gate lied). --package installs the runtime member
          # (which carries infra2-sdk); --with httpx satisfies default_http_get's
          # lazy import, which the runtime's own deps do not pull.
          uv run --package truealpha-runtime --with httpx python tools/health_check.py \
            "https://truealpha.club/api/health" \
            "$EXPECTED_RELEASE" \
            24

      # #560 (W4): the health gate proves the release is LIVE; this proves it is
      # USABLE. Every web property #494/#371/#495/#540 guard is asserted in
      # ci-web against a build, and was true nowhere a person is — both
      # environments served a release from two weeks earlier while the
      # properties were green on main. A release is not verified until the same
      # suite has walked the deployed surface, which is also the closure
      # condition rule 6 already implies for those four issues.
      #
      # Unconfigured credentials do NOT fail the release, and that is a
      # correction to how this shipped. A prod release requires this repo's own
      # successful "Deploy staging <tag>" run, so a hard failure here blocked
      # EVERY prod release — including the one that would carry the fix — which
      # is precisely the "finished work stays invisible" outcome #560 exists to
      # prevent. Blocking the lane on a setup deficiency punishes the wrong
      # thing.
      #
      # The two questions are separated instead. This run answers "is it
      # deployed". Whether the surface was ever walked is a STANDING question,
      # answered daily by tools/walk_evidence.py in deploy-freshness.yml, which
      # is red until the deployed release has a successful walk. Same pressure,
      # no deadlock, and neither signal has to mean two things.
      # Credentials decide whether the walk RUNS. It must not run-and-pretend:
      # an unconfigured walk that exits 0 gives the step a `success` conclusion,
      # and tools/walk_evidence.py reads exactly that — so the standing check
      # built to keep this visible was satisfied by the case it exists to catch.
      # Caught by verifying a real staging release rather than the workflow file.
      #
      # `secrets` is not reliably available in a step-level `if`, so it is
      # reduced to an output here.
      - name: Are the surface-walk credentials configured
        id: walk_credentials
        env:
          TA_EMAIL: ${{ secrets.E2E_WALK_EMAIL }}
          TA_MEMBER_EMAIL: ${{ secrets.E2E_WALK_MEMBER_EMAIL }}
          TA_PASSWORD: ${{ secrets.E2E_WALK_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${TA_EMAIL}" ] && [ -n "${TA_PASSWORD}" ] && [ -n "${TA_MEMBER_EMAIL}" ]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "::error::post-release surface verification is UNCONFIGURED — this release is \
          deployed but unverified. Add repository secrets E2E_WALK_EMAIL, E2E_WALK_PASSWORD and \
          E2E_WALK_MEMBER_EMAIL. deploy-freshness reports this daily until a deployed release \
          has a successful walk (#560)."
            {
              echo "### Surface walk: UNVERIFIED"
              echo
              echo "Credentials are not configured, so nothing confirmed a person can use this"
              echo "release. The walk step below is SKIPPED, which \`tools/walk_evidence.py\`"
              echo "reads as missing evidence — deliberately, so an absent walk cannot pass for"
              echo "a successful one."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      # Skipped when unconfigured — conclusion "skipped", never "success". A real
      # walk failure DOES fail the release: the deadlock this design avoids came
      # from the unconfigured case, not from a broken surface, and a release whose
      # surface is broken should not become prod evidence.
      # The walk step measured 116s of a ~480s release, and nearly all of it was
      # `playwright install` pulling a 110MB Chromium on every single run. The
      # whole workflow had no cache of any kind. Keyed on the Playwright version
      # in the lockfile, so a version bump misses the cache and re-downloads
      # rather than running the wrong browser.
      # actions/cache needs `actions: write` to SAVE. The workflow-level grant is
      # `actions: read`, so without the job-level grant below the cache restores
      # and never populates — the optimisation would report as working and do
      # nothing, which is worse than not adding it (review).
      - name: Cache the Playwright browser
        if: ${{ steps.walk_credentials.outputs.ready == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/app-web/bun.lock') }}
      - name: Walk the deployed surface
        if: ${{ steps.walk_credentials.outputs.ready == 'true' }}
        env:
          TA_BASE_URL: ${{ inputs.deploy_type == 'prod' && 'https://truealpha.club' || 'https://truealpha-staging.truealpha.club' }}
          TA_EMAIL: ${{ secrets.E2E_WALK_EMAIL }}
          TA_MEMBER_EMAIL: ${{ secrets.E2E_WALK_MEMBER_EMAIL }}
          TA_PASSWORD: ${{ secrets.E2E_WALK_PASSWORD }}
        working-directory: apps/app-web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

          # #698: the first navigation raced the container swap. The health
          # gate above polls llm-service, a DIFFERENT container from app-web,
          # so nothing was warming the pages the walk opens. The warm-up lives
          # in a script because a shell function inlined here can only be
          # checked by slicing YAML text — and the first attempt at that
          # sliced the wrong region and passed anyway (review). It verifies
          # nothing and cannot fail; the walk below is the gate.
          # $GITHUB_WORKSPACE, not a bare relative path: this step sets
          # working-directory: apps/app-web (the walk needs it), so `tools/…` resolved to
          # apps/app-web/tools/ and every deploy died with exit 127 "No such file or
          # directory" — for a script that was present at the repo root the whole time.
          "$GITHUB_WORKSPACE/tools/warm_surface.sh" "$TA_BASE_URL" / /research/rankings

          node e2e/walk-tree.mjs
