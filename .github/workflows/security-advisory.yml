name: security-advisory

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Audit JS dependencies (bun audit advisory)
        continue-on-error: true
        working-directory: apps/app-web
        run: |
          set +e
          output="$(bun audit 2>&1)"
          status=$?
          {
            echo "### JS Dependency Audit (\`bun audit\`, exit=$status)"
            echo '```text'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - name: Audit Python dependencies (pip-audit advisory)
        continue-on-error: true
        run: |
          set +e
          uv sync --all-packages --frozen
          output="$(uv run --frozen --with pip-audit pip-audit 2>&1)"
          status=$?
          {
            echo "### Python Dependency Audit (\`pip-audit\`, exit=$status)"
            echo '```text'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
