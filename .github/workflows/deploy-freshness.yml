name: deploy-freshness

# #560 (W5): fail when an environment is serving work that finished days ago.
#
# On 2026-08-14 both environments served v0.0.19, cut 2026-07-30, while main ran
# 18 commits ahead — the factor corrections, the datahub fixes and the whole
# app-web remediation, invisible to every user for 15 days. Nothing was red
# about it, because no acceptance criterion in this repository was ever about
# how old what a user sees is. This is that criterion.
#
# The bound is AGE, not commit count, deliberately: a count measures how busy
# the repository has been, age measures how long finished work has been
# invisible. Ten commits merged this morning are not a problem; one commit
# merged last week is.
#
# The bound is PER ENVIRONMENT (#819). tools/cut_release.sh deploys staging
# after every tag and promotes production only with --prod, so production lags
# staging by design: the owner promotes deliberately, and one tag per merged PR
# (five on 2026-09-15, v0.0.56–v0.0.60) means several tags soak before one is
# promoted. One bound for both legs had production red every day for exactly
# that lag (run 34940255057: v0.0.51 served, 21 commits unreleased, oldest
# 4d19h, limit 3d). Staging keeps 3 days — finished work must reach the soak
# quickly. Production gets 14: a fortnight for a deliberate promotion, and
# still under the 15-day gap this check was written for, so #560's failure
# would fire at this bound too. The numbers live in the matrix below and in
# tools/deploy_freshness.py (STAGING_/PRODUCTION_MAX_AGE_DAYS);
# test_ci_workflows.py holds the two in agreement.

on:
  schedule:
    # 07:00 UTC daily — after the 22:15 UTC pipeline tick and before a working
    # day starts, so a stale environment is the first thing anyone sees.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        # Read below as `github.event.inputs.*`, not `inputs.*`: the `inputs`
        # context belongs to workflow_dispatch/workflow_call, and this workflow's
        # PRIMARY trigger is the schedule. A guard whose own expression can fail
        # on its main trigger is the failure mode it exists to prevent (review).
        # Applies to BOTH legs when set. No default on purpose: a default of
        # "3" would flatten production's bound back to staging's on every
        # manual dispatch. Empty runs the per-environment matrix bounds; a
        # red-proof can pass 0 to force both legs red.
        description: "Override the per-environment bound for both legs (empty = matrix values)"
        required: false

permissions:
  contents: read
  # walk_evidence.py reads this repository's own release runs.
  actions: read
  # #680: a scheduled failure files/updates a tracking issue instead of dying
  # quietly in the Actions tab.
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    # 10 min of checks plus tools/walk_evidence.py's bounded wait for a release caught mid-flight
    # (IN_FLIGHT_WAIT, 15 min; a test keeps the two in step).
    timeout-minutes: 25
    env:
      # One definition for the escalate and resolve steps at the end: the
      # issue a red leg opens is the issue its next green run closes.
      ESCALATION_TITLE: "deploy-freshness is red: ${{ matrix.environment }} failed its standing checks"
    strategy:
      fail-fast: false
      matrix:
        include:
          # `deploy_type` is what deploy-release.yml's run-name is built from
          # ("Deploy prod v0.0.20"); `environment` is the human name used in
          # messages. Conflating them made the evidence check look for runs that
          # can never exist (review).
          # `max_age_days` is the per-environment bound (#819, header comment):
          # production is promoted deliberately and may lag; staging is where
          # every tag lands and must not.
          - environment: production
            deploy_type: prod
            url: https://truealpha.club/api/health
            base: https://truealpha.club
            max_age_days: 14
            pointer_max_age_hours: 72
          - environment: staging
            deploy_type: staging
            url: https://truealpha-staging.truealpha.club/api/health
            base: https://truealpha-staging.truealpha.club
            max_age_days: 3
            pointer_max_age_hours: 72
    steps:
      # Full history AND tags: the environments report release tags, and the
      # check resolves that tag to a commit to measure the gap. A shallow clone
      # makes every environment look unresolvable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force origin
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - name: Check ${{ matrix.environment }} freshness
        run: |
          uv run --no-sync python tools/deploy_freshness.py \
            "${{ matrix.url }}" \
            --environment "${{ matrix.environment }}" \
            --max-age-days "${{ github.event.inputs.max_age_days || matrix.max_age_days }}"

      # A4 C1 (#673): the routing shape, against the REAL proxy. Four
      # production releases went into one redirect and every defect in it was
      # invisible to the TestClient that "covered" it — Traefik strips /api and
      # Compose clears the image CMD, neither of which a simulated proxy has.
      # `if: always()` because a stale deploy and a broken route are separate
      # facts and the second must not be hidden by the first.
      - name: Check ${{ matrix.environment }} routing shape
        if: always()
        run: |
          set -euo pipefail
          # matrix.base, not matrix.url: url is the health ENDPOINT and this
          # probe builds its own paths from the base. Passing url would have
          # requested /api/health/api/health and reported the surface down.
          python3 tools/surface_contract.py "${{ matrix.base }}"

      # The governed pointer's age, per universe (tools/datahub_freshness.py): the
      # a1 gate may withhold the pointer for days with every check above green.
      # `if: always()` for the same reason as the routing shape — a frozen head and a
      # stale release are separate facts.
      - name: Check ${{ matrix.environment }} governed pointer freshness
        if: always()
        run: |
          uv run --no-sync python tools/datahub_freshness.py \
            "${{ matrix.url }}" \
            --environment "${{ matrix.environment }}" \
            --max-age-hours "${{ matrix.pointer_max_age_hours }}"

      # #876 W1/W2: the nightly in-environment checks (output invariants, report surface
      # proof, confidence report, head reports, model-provider key probe) run inside the
      # environment's Dagster daemon, which this runner cannot reach; /api/health publishes
      # each one's newest verdict (tools/nightly_verdicts.py). Red on a failed, stale (2x
      # cadence) or missing verdict. `if: always()` for the same reason as the steps above.
      # --repo: the expected checks are read at the deployed release's tag (full history and
      # tags are fetched above), so a check main adds is not demanded of a lagging release.
      - name: Check ${{ matrix.environment }} nightly check verdicts
        if: always()
        run: |
          uv run --no-sync python tools/nightly_verdicts.py \
            "${{ matrix.url }}" \
            --environment "${{ matrix.environment }}" \
            --repo .

      - name: Check ${{ matrix.environment }} surface-walk evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --no-sync python tools/walk_evidence.py \
            --deploy-type "${{ matrix.deploy_type }}" \
            --environment "${{ matrix.environment }}" \
            --url "${{ matrix.url }}"

      # #680: same escalation as mutation-reproof, same reasons — the 08-24
      # reproof failure sat 4 days because a red scheduled run pages nobody, and
      # this workflow has the identical failure surface. Reports, never rescues:
      # the run's conclusion is already failure when this fires (acceptance 3).
      # tools/escalate_issue.py owns the open-or-comment rule (exact-title
      # match; a failed LIST never falls through to create). The title is
      # PER ENVIRONMENT (job env above): the legs run in parallel, and an
      # env-agnostic title let staging comment on production's issue, or both
      # legs file one each on first breakage — the red-proof produced #687 and
      # #688 from one forced failure. No pull_request trigger here, so the
      # workflow-level issues grant stays acceptable.
      - name: Escalate a scheduled failure to an issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ matrix.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Scheduled/dispatched run failed for $ENVIRONMENT: $RUN_URL"
            echo
            echo "Filed automatically (#680). One open issue per breakage: reruns comment here instead of filing again; the next green scheduled run closes it (#876)."
          } > body.md
          python3 tools/escalate_issue.py open --title "$ESCALATION_TITLE" --body-file body.md

      # #876 (W3): the other half. #818 stayed open two days after staging was
      # fresh again, so an open alert had stopped meaning "broken now". A green
      # leg closes its own environment's issue; nothing open is a no-op.
      # Only a run that measured with the SCHEDULED bounds may close: a
      # dispatch with `max_age_days` set is a red-proof or an experiment, and
      # a looser override (say 30) would be green while the real 3-day bound is
      # still red — closing a live alert. A dispatch with the input empty runs
      # exactly the schedule's checks, so it may close (that is the drill's
      # second half). main only: a dispatch on a branch runs that branch's
      # matrix, whose bounds are not the ones the alert was raised under.
      - name: Resolve the issue once the checks are green
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !github.event.inputs.max_age_days))
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ matrix.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Resolved: every standing check for $ENVIRONMENT passed at the scheduled bounds in $RUN_URL"
            echo
            echo "Closed automatically (#876). A later failure files a new issue."
          } > body.md
          python3 tools/escalate_issue.py resolve --title "$ESCALATION_TITLE" --body-file body.md
