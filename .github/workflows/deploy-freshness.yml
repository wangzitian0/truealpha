name: deploy-freshness

# #560 (W5): fail when an environment is serving work that finished days ago.
#
# On 2026-08-14 both environments served v0.0.19, cut 2026-07-30, while main ran
# 18 commits ahead — the factor corrections, the datahub fixes and the whole
# app-web remediation, invisible to every user for 15 days. Nothing was red
# about it, because no acceptance criterion in this repository was ever about
# how old what a user sees is. This is that criterion.
#
# The bound is AGE, not commit count, deliberately: a count measures how busy
# the repository has been, age measures how long finished work has been
# invisible. Ten commits merged this morning are not a problem; one commit
# merged last week is.

on:
  schedule:
    # 07:00 UTC daily — after the 22:15 UTC pipeline tick and before a working
    # day starts, so a stale environment is the first thing anyone sees.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        # Read below as `github.event.inputs.*`, not `inputs.*`: the `inputs`
        # context belongs to workflow_dispatch/workflow_call, and this workflow's
        # PRIMARY trigger is the schedule. A guard whose own expression can fail
        # on its main trigger is the failure mode it exists to prevent (review).
        description: "Fail when the oldest unreleased commit is older than this"
        required: false
        default: "3"

permissions:
  contents: read
  # walk_evidence.py reads this repository's own release runs.
  actions: read
  # #680: a scheduled failure files/updates a tracking issue instead of dying
  # quietly in the Actions tab.
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # `deploy_type` is what deploy-release.yml's run-name is built from
          # ("Deploy prod v0.0.20"); `environment` is the human name used in
          # messages. Conflating them made the evidence check look for runs that
          # can never exist (review).
          - environment: production
            deploy_type: prod
            url: https://truealpha.club/api/health
          - environment: staging
            deploy_type: staging
            url: https://truealpha-staging.truealpha.club/api/health
    steps:
      # RED-PROOF ONLY (#680), reverted before merge: force the job red so the
      # escalation step below demonstrably fires on a branch dispatch.
      - name: red-proof forced failure
        run: exit 1
      # Full history AND tags: the environments report release tags, and the
      # check resolves that tag to a commit to measure the gap. A shallow clone
      # makes every environment look unresolvable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force origin
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - name: Check ${{ matrix.environment }} freshness
        run: |
          uv run --no-sync python tools/deploy_freshness.py \
            "${{ matrix.url }}" \
            --environment "${{ matrix.environment }}" \
            --max-age-days "${{ github.event.inputs.max_age_days || '3' }}"

      # #560 (W4): freshness asks "is what a user sees recent". This asks "did
      # anyone confirm a user can USE it". Separate questions, separate signals —
      # and deliberately NOT enforced inside the release run, which would block
      # every prod release on a setup deficiency (prod requires a successful
      # staging run) and so reproduce the invisible-work failure this workflow
      # exists to catch. `always()` so a stale environment still gets asked.
      # #581: the invariants against REAL data. Production's Postgres binds to
      # the VPS loopback, so a runner cannot reach it without a tunnel the owner
      # provisions — stated rather than papered over. Unconfigured is announced
      # loudly and does not fail the schedule, the same shape #560 settled on
      # for the surface walk: the release run answers "is it deployed", a
      # standing check answers "was it verified", and neither pretends.
      - name: Output invariants (${{ matrix.environment }})
        if: ${{ matrix.deploy_type == 'prod' }}
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_DATABASE_URL}" ]; then
            echo "::error::the output invariants have no reachable production database. They are \
          the only check that asks whether a published NUMBER is possible, and today they run \
          only against the CI fixture, where most of them examine zero rows. Provision a tunnel \
          and set PROD_DATABASE_URL (#581)."
            exit 0
          fi
          uv run --no-sync python tools/output_invariants.py \
            --database-url "$PROD_DATABASE_URL" --require-coverage

      - name: Check ${{ matrix.environment }} surface-walk evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --no-sync python tools/walk_evidence.py \
            --deploy-type "${{ matrix.deploy_type }}" \
            --environment "${{ matrix.environment }}" \
            --url "${{ matrix.url }}"

      # #680: same escalation as mutation-reproof, same reasons — the 08-24
      # reproof failure sat 4 days because a red scheduled run pages nobody, and
      # this workflow has the identical failure surface. Matrix legs share one
      # issue through the title search. Reports, never rescues: the run's
      # conclusion is already failure when this fires (acceptance 3).
      - name: Escalate a scheduled failure to an issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="deploy-freshness is red: ${{ matrix.environment }} failed its standing checks"
          {
            echo "Scheduled/dispatched run failed for ${{ matrix.environment }}: $RUN_URL"
            echo
            echo "Filed automatically (#680). One open issue per breakage: reruns comment here instead of filing again."
          } > body.md
          EXISTING=$(gh issue list --state open --search "in:title \"deploy-freshness is red\"" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
