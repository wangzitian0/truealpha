name: ci-db

on:
  workflow_call:

jobs:
  # Apply every migration + roles.sql against a throwaway Postgres — the DDL must
  # always be runnable from scratch. Since #984 "matching what docker-compose does
  # locally" is literal rather than aspirational: this step, the compose initdb hook,
  # the Makefile and the llm-service boot all run db/apply_migrations.sh.
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply the migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      # apply_migrations.sh's own header comment states every migration file "is
      # itself written to be safe to re-run" -- and it re-applies the full chain on
      # EVERY container boot (staging/prod/preview), not just the first.
      # A single fresh-DB pass never exercises that invariant, and #455 shipped a
      # migration that silently broke it (a plain `drop constraint` with no IF
      # EXISTS, fine on the first run, ON_ERROR_STOP-fatal on every run after) --
      # crash-looping llm-service on both staging and production for days before
      # anyone noticed, because nothing tested a second pass. Running the exact same
      # applier a second time here catches that class of regression before merge.
      - name: Re-apply the migration chain (idempotency)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      # #615: the two passes above prove the DDL is syntactically re-runnable.
      # They cannot prove it survives the data the system produces, because the
      # database they replay over is EMPTY. 0017 and 0018 rebuilt the contract
      # kind vocabulary from a literal list while 0038 and 0041 widen it, so on
      # any database that had reached the end of the chain the replay narrowed
      # the constraint and then failed to validate it — 17 llm-service restart
      # loops on production and 182 on staging, from one legal row. Seed one
      # object per legal kind, then replay a THIRD time.
      - name: Seed one object per legal contract kind
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d truealpha -v ON_ERROR_STOP=1 -f db/tests/contract_kind_replay_seed.sql
      # roles.sql is part of the pass, exactly as in the two above: the migrations
      # rebuild views and reset grants, and roles.sql carries the permanent ones.
      # Omitting it left the governed-research-access contract failing on "audit
      # reader must receive only the filtered metadata view" — a permission state no
      # boot ever has. Since #984 that ordering is not a property of this step at all:
      # db/apply_migrations.sh applies roles.sql last, everywhere, by construction.
      - name: Re-apply the migration chain over real rows (replay-with-data)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      - name: Assert runtime persistence contract
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d truealpha -v ON_ERROR_STOP=1 -f db/tests/runtime_contract.sql
      # #472: these three contract files had no execution host anywhere — written,
      # reviewed, never run (governed_research_access_contract.sql even SAID so in
      # a docstring). All are schema-level and self-seeding inside a rolled-back
      # transaction, so the freshly migrated database above is the right target.
      - name: Assert orphaned db/tests contracts
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/tests/capture_control_contract.sql \
                   db/tests/headcount_extraction_contract.sql \
                   db/tests/governed_research_access_contract.sql \
                   db/tests/role_boundary_contract.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d truealpha -v ON_ERROR_STOP=1 -f "$f"
          done
      # #472 meta-check (#373 class): a contract test nothing runs passes no
      # signal. A file counts as hosted only when (a) a workflow or shell runner
      # names its full db/tests/ path, or (b) a Python/TS file references it AND
      # that file itself executes SQL (psql / ON_ERROR_STOP) — a prose-only
      # mention in a non-executing file no longer counts (#480 review found
      # exactly that false positive). Known residual gap, accepted and
      # documented: a prose mention inside a file that executes a DIFFERENT
      # contract still passes; tighten to an explicit host manifest if it bites.
      - name: Every db/tests file has an execution host
        run: |
          set -euo pipefail
          missing=0
          for f in db/tests/*.sql; do
            name="$(basename "$f")"
            hosted=0
            if grep -rqF -- "db/tests/$name" .github/workflows db/apply_migrations.sh 2>/dev/null; then
              hosted=1
            else
              while IFS= read -r ref; do
                if grep -qE "psql|ON_ERROR_STOP" "$ref"; then hosted=1; break; fi
              done < <(grep -rlF -- "$name" libs apps tools --include="*.py" --include="*.ts" 2>/dev/null || true)
            fi
            if [ "$hosted" -eq 0 ]; then
              echo "::error::db/tests/$name has no executing host — give it a real runner or delete it"
              missing=1
            fi
          done
          exit "$missing"

      # #581: the invariants, against the schema this workflow just migrated.
      # Here rather than ci-web because that workflow has no Python toolchain
      # (the first attempt died on `uv: command not found`) and because a
      # question about what is IN the database belongs beside the workflow that
      # owns the database contracts.
      #
      # An empty schema means most invariants examine zero rows; the tool prints
      # that rather than reporting ok over an empty set, and `--require-coverage`
      # is deliberately not passed here. It IS passed where the data is real.
      - uses: astral-sh/setup-uv@v5
      - name: Output invariants (migrated schema)
        env:
          PGPASSWORD: postgres
        run: |
          uv sync --all-packages
          uv run --no-sync python tools/output_invariants.py \
            --database-url postgresql://postgres:postgres@localhost:5432/truealpha

      # #984: the schema this workflow just migrated, compared against the chain it was
      # migrated FROM. The tool builds its own reference database from db/migrations +
      # db/roles.sql on this same server and diffs the two catalogs, so nothing here has
      # to be kept fresh when a migration lands. What this step proves is that the check
      # runs in CI and is green on a database that did run the chain; that it can go RED
      # is proved by libs/runtime/tests/test_schema_drift.py, which breaks a database on
      # purpose (#939's staging.market_prices_daily shape among them) and asserts the
      # tool names what broke. Green here after three replays and a seeded contract row
      # also says replay left the schema where the chain puts it.
      - name: Schema drift (migrated schema against the declared chain)
        run: |
          uv run --no-sync python tools/schema_drift.py \
            --database-url postgresql://postgres:postgres@localhost:5432/truealpha
