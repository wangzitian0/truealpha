name: main-health

# #876 (W12): a red `ci-required` on a push to main alerted nobody; it was found
# at the next release attempt. Branch protection runs with strict up-to-date
# OFF, so the main run is the only place two PRs' changes are tested together —
# on 2026-09-16 #868 merged on top of #869 and turned main red (fixed by #873)
# with every PR check green.
#
# So each completed main-push run of ci-required files or resolves ONE issue:
#   failure -> open (or comment on) "main is red: ci-required failed on push"
#   success -> resolve it: main is green again, so the alert closes itself
#   anything else (cancelled, skipped, ...) -> nothing; that run judged nothing.
# A red commit followed by a green one closes the issue — intended: the alert
# means "main HEAD's ci-required is red NOW". With #883's sha-keyed groups main
# runs no longer cancel each other, so every main commit reports its own
# conclusion (before it, a superseded run concludes `cancelled` and is ignored
# here). Each failure records its top-level failed lanes (`failed-lanes: ...`),
# and a green run resolves the incident only when every recorded failed lane
# actually ran and passed on that run.
#
# workflow_run executes THIS file from the default branch with a write token,
# so nothing from the triggering run is ever interpolated into a `run:` — the
# commit message and SHA reach the shell only through `env:`.

on:
  workflow_run:
    workflows: [ci-required]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # `gh run view` names the failed jobs in the issue body.
  actions: read
  issues: write

# Serialised, never cancelled mid-write: two completions close together must
# not race an open against a close. GitHub keeps only the newest pending run,
# which is the one whose conclusion should stand.
concurrency:
  group: main-health
  cancel-in-progress: false

env:
  ESCALATION_TITLE: "main is red: ci-required failed on push"

jobs:
  report:
    # `branches: [main]` matches the head BRANCH name, which a pull_request from
    # a fork's own `main` also carries; only a push event is a main commit.
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Open or update the red-main issue
        if: github.event.workflow_run.conclusion == 'failure'
        run: |
          set -euo pipefail
          COMMIT_TITLE="${COMMIT_MESSAGE%%$'\n'*}"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > run_jobs.json || echo '{"jobs":[]}' > run_jobs.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          jobs = json.loads(Path("run_jobs.json").read_text(encoding="utf-8")).get("jobs", [])
          failed = [j for j in jobs if j.get("conclusion") == "failure" and j.get("name")]
          lanes = {str(j["name"]).split(" / ", 1)[0].strip() for j in failed}
          non_agg = {lane for lane in lanes if lane != "ci-required"}
          if non_agg:
              lanes = non_agg
          if not lanes:
              lanes = {"unknown"}
          failed_lines = [f"- {j['name']}" for j in failed] or ["- (could not list the jobs; open the run)"]
          Path("failed_lanes.txt").write_text(", ".join(sorted(lanes)), encoding="utf-8")
          Path("failed_jobs.txt").write_text("\n".join(failed_lines), encoding="utf-8")
          PY
          FAILED_LANES="$(cat failed_lanes.txt)"
          {
            echo "ci-required failed on a push to main."
            echo
            echo "- commit: $HEAD_SHA"
            echo "- title: $COMMIT_TITLE"
            echo "- run: $RUN_URL"
            echo "failed-lanes: $FAILED_LANES"
            echo
            echo "Failed jobs:"
            cat failed_jobs.txt
          } > body.md
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ESCALATION_TITLE in:title" --json number,title --jq ".[] | select(.title == \"$ESCALATION_TITLE\") | .number" | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ESCALATION_TITLE" --body-file body.md --label incident
          fi

      - name: Resolve the red-main issue
        if: github.event.workflow_run.conclusion == 'success'
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ESCALATION_TITLE in:title" --json number,title --jq ".[] | select(.title == \"$ESCALATION_TITLE\") | .number" | head -n1 || true)
          if [ -z "$EXISTING" ]; then
            exit 0
          fi
          gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json body,comments > issue.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > run_jobs.json
          if ! python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          issue = json.loads(Path("issue.json").read_text(encoding="utf-8"))
          jobs = json.loads(Path("run_jobs.json").read_text(encoding="utf-8")).get("jobs", [])

          texts = [issue.get("body") or ""] + [
              c.get("body") or "" for c in (issue.get("comments") or [])
          ]
          required_lanes: set[str] = set()
          for text in texts:
              for line in text.splitlines():
                  match = re.match(r"^\s*(?:-\s*)?failed-lanes:\s*(.+)$", line, re.IGNORECASE)
                  if match:
                      for part in match.group(1).split(","):
                          lane = part.strip()
                          if lane:
                              required_lanes.add(lane)

          def lane_succeeded(lane: str) -> bool:
              lane_jobs = [
                  j
                  for j in jobs
                  if j.get("name") == lane or str(j.get("name") or "").startswith(f"{lane} / ")
              ]
              return bool(
                  lane_jobs
                  and any(j.get("conclusion") == "success" for j in lane_jobs)
                  and all(j.get("conclusion") in ("success", "skipped") for j in lane_jobs)
              )

          if not required_lanes:
              if not any(lane_succeeded(lane) for lane in ("python", "web", "db")):
                  print("Core code lanes did not pass on current run; keeping incident open.")
                  raise SystemExit(1)
              raise SystemExit(0)

          missing = [lane for lane in sorted(required_lanes) if not lane_succeeded(lane)]
          if missing:
              print("Unverified failed lanes on current run:", ", ".join(missing))
              raise SystemExit(1)
          PY
          then
            echo "Keeping open incident #$EXISTING on $HEAD_SHA until all recorded failed lanes pass."
            exit 0
          fi
          COMMIT_TITLE="${COMMIT_MESSAGE%%$'\n'*}"
          {
            echo "Resolved: ci-required passed on a push to main."
            echo
            echo "- commit: $HEAD_SHA"
            echo "- title: $COMMIT_TITLE"
            echo "- run: $RUN_URL"
          } > body.md
          gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "$(cat body.md)"
