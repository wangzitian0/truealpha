name: ci-required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      force_images:
        description: Publish all current-ref images after required checks.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-required-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      db: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.db }}
      python: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.python }}
      runtime: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.runtime }}
      web: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.web }}
      image_app_web: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_app_web }}
      image_llm_service: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_llm_service }}
      image_data_engine: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_data_engine }}
      dagster_liveness: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.dagster_liveness }}
      data_engine: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.data_engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        if: github.ref_type != 'tag' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              # ci-db executes tools/output_invariants.py and tools/schema_drift.py
              # against the migrated schema; editing those tools or their runtime
              # implementations must re-run it (#1523).
              - 'tools/**'
              - 'common/runtime/src/truealpha_tools/output_invariants.py'
              - 'common/runtime/src/truealpha_tools/schema_drift.py'
              - 'db/**'
              - '.github/workflows/ci-db.yml'
              - '.github/workflows/ci-required.yml'
              # The setup-uv action installs uv in this lane (#1248). A PR that edits only
              # the action must re-run every lane that calls it: `required` reads a skip as success.
              - '.github/actions/**'
            python:
              # tools/*.py are the deploy gates themselves; their tests live in
              # common/runtime/tests via load_tool, which only ci-python runs. A
              # tools-only PR used to match NO filter, and `required` treats a
              # skipped job as success — so the gate tooling could merge with
              # zero tests executed (A4 review finding, #673).
              - 'tools/**'
              # Same class, one directory over, exposed by #689's own checks:
              # test_ci_workflows.py pins the SHAPE of deploy-release,
              # delivery-report, issue-close-guard and mutation-reproof — and a
              # PR editing those workflows matched no python filter, so the
              # tests that pin them were exactly the ones that did not run.
              - '.github/workflows/**'
              - 'apps/data-engine/**'
              - 'apps/llm-service/**'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'db/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci-python.yml'
              - '.github/workflows/ci-required.yml'
              - '.github/actions/**'
              # dagster_liveness below must stay a SUBSET of this list (pinned in
              # test_ci_workflows.py): otherwise a docker-compose-only change can set
              # dagster_liveness true while ci-python.yml — and the liveness job
              # inside it — never runs at all, since `python` below gates the call.
              - 'docker-compose.yml'
              # What the shared rule source publishes, all of it read by
              # test_ci_workflows.py: skills/ is a scan root, .claude/, .agents/
              # and .ws-publish/ are excluded only on premises asserted there, and
              # AGENTS.md is a root file. #1018 touched
              # only such paths, matched no filter, and merged with that file red
              # on main.
              - 'skills/**'
              - '.claude/**'
              - '.agents/**'
              - '.ws-publish/**'
              # #1412: a document starts this lane only when a test reads it, and
              # test_a_document_selects_the_lanes_that_read_it_and_no_other derives
              # the readers from the tests. Every top-level markdown file is read:
              # by the reintroduction sweep, or by name (init.md, README.md,
              # AGENTS.md). Three files under docs/ are read by name. Other files
              # under docs/ start no lane.
              - '*.md'
              - 'docs/architecture-decisions/A3-source-governance.md'
              - 'docs/datahub-quality-report.md'
              - 'docs/release-protocol.md'
              - 'runtime-hooks.manifest.json'
            # #855 A4: dagster-code-server-liveness (truealpha#454's daemon
            # self-termination class) sat on every PR's and every main push's
            # critical path — 151-160s of it, most of the job's own wall time —
            # for a regression that reproduces only through the dagster
            # composition root, its lanes, the image it runs in, and its own
            # job definition. Narrower than `python` on purpose: ~95% of PR
            # diffs never touch any of this. docker-compose.yml matches
            # whole-file (paths-filter has no section-level match) even though
            # it defines no dedicated dagster service today — the closest
            # available proxy for the day it does, and it is why the entry
            # is also in `python` above.
            dagster_liveness:
              - 'apps/data-engine/src/data_engine/dagster_defs.py'
              - 'apps/data-engine/src/data_engine/lanes/**'
              - 'apps/data-engine/Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci-python.yml'
            data_engine:
              - 'apps/data-engine/**'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'db/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci-python.yml'
              - '.github/workflows/ci-required.yml'
              - '.github/actions/**'
              - 'docker-compose.yml'
              - 'tools/**'
              # Two documents that tests under apps/data-engine/tests read (#1412).
              - 'README.md'
              - 'docs/datahub-quality-report.md'
            runtime:
              # #984: ci-runtime executes tools/schema_drift.py against the schema the
              # compose bootstrap produced — the same reason `db` above carries
              # tools/**. A tool this lane runs must re-run this lane.
              - 'tools/**'
              - 'docker-compose.yml'
              - '.env.example'
              - 'db/**'
              - 'common/contracts/**'
              - 'common/runtime/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci-runtime.yml'
              - '.github/workflows/ci-required.yml'
              - '.github/actions/**'
            web:
              # ci-web runs the app-web half of tools/check_route_manifest.py
              # and the walk seeds read tools/route_manifest.json.
              - 'tools/**'
              - 'apps/app-web/**'
              - 'common/contracts/conformance/**'
              - '.github/workflows/ci-web.yml'
              - '.github/workflows/ci-required.yml'
            # No `!` entry stands in these lanes (#1412). This step uses the default
            # `some` quantifier: a lane starts when ANY entry matches ANY changed file,
            # and a `!` entry matches every path it does not name. The `!` entries that
            # #1168 added started all three image builds on every PR, a rules-only PR
            # included. A test-only or markdown-only change inside an image scope now
            # builds that image again, as it did before #1168.
            image_app_web:
              - 'apps/app-web/**'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'
            image_llm_service:
              - 'apps/llm-service/**'
              - 'apps/data-engine/pyproject.toml'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'
            image_data_engine:
              - 'apps/data-engine/**'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'

  security:
    needs: changes
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-gate.yml

  db:
    if: needs.changes.outputs.db == 'true'
    needs: changes
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci-db.yml

  python:
    if: needs.changes.outputs.python == 'true'
    needs: changes
    uses: ./.github/workflows/ci-python.yml
    with:
      dagster_liveness_required: ${{ github.event_name != 'pull_request' || needs.changes.outputs.dagster_liveness == 'true' }}
      data_engine_required: ${{ github.event_name != 'pull_request' || needs.changes.outputs.data_engine == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  runtime:
    if: needs.changes.outputs.runtime == 'true'
    needs: changes
    uses: ./.github/workflows/ci-runtime.yml
    permissions:
      contents: read
      pull-requests: read
      actions: write

  web:
    if: needs.changes.outputs.web == 'true'
    needs: changes
    uses: ./.github/workflows/ci-web.yml
    permissions:
      contents: read
      pull-requests: read
      actions: write

  images_build:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'merge_group' ||
       (github.event_name == 'pull_request' &&
        (needs.changes.outputs.image_app_web == 'true' ||
         needs.changes.outputs.image_llm_service == 'true' ||
         needs.changes.outputs.image_data_engine == 'true')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.force_images))
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/release-images.yml
    with:
      publish: false
      app_web: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.force_images) || needs.changes.outputs.image_app_web == 'true' }}
      llm_service: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.force_images) || needs.changes.outputs.image_llm_service == 'true' }}
      data_engine: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.force_images) || needs.changes.outputs.image_data_engine == 'true' }}

  images_release:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.force_images)) &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      needs.images_build.result == 'success'
    needs: [changes, security, db, python, runtime, web, images_build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      publish: true
      app_web: true
      llm_service: true
      data_engine: true
      prebuilt: true

  required:
    name: ci-required
    if: always()
    needs: [changes, security, db, python, runtime, web, images_build, images_release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any failed, cancelled, or missing dependency
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$RESULTS")"
          if [ -n "$failures" ]; then
            echo "Required CI dependencies did not pass:" >&2
            echo "$failures" >&2
            exit 1
          fi
          echo "All affected CI dependencies passed or were explicitly skipped."
