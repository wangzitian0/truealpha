name: ci-required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      force_images:
        description: Publish all current-ref images after required checks.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A tag push and the main push of one commit get separate groups: promote needs the main publish (#1878).
  group: ci-required-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.ref_type }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      db: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.db }}
      python: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.python }}
      web: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.web }}
      image_app_web: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_app_web }}
      image_llm_service: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_llm_service }}
      image_data_engine: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_data_engine }}
      dagster_liveness: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.dagster_liveness }}
      data_engine: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.data_engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch origin main --depth=100
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: filter
        if: github.ref_type != 'tag' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              - 'db/**'
              - '.github/workflows/ci-db.yml'
              - '.github/workflows/ci-required.yml'
            python:
              # tools/ contains deployed scripts; their tests live in common/runtime/tests.
              - 'tools/**'
              # Same class, one directory over: test_ci_workflows.py reads the
              # workflows, so a PR that edits a workflow must run it.
              - '.github/workflows/**'
              - 'apps/data-engine/**'
              - 'apps/llm-service/**'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'db/**'
              - 'pyproject.toml'
              - 'AGENTS.md'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci-python.yml'
              - '.github/workflows/ci-required.yml'
              - '.github/actions/**'
              # dagster_liveness below must stay a SUBSET of this list: otherwise a docker-compose-only change can set
              # dagster_liveness true while ci-python.yml — and the liveness job
              # inside it — never runs at all, since `python` below gates the call.
              - 'docker-compose.yml'
              - 'runtime-hooks.manifest.json'
            # #855 A4: dagster-code-server-liveness (truealpha#454's daemon
            # self-termination class) sat on every PR's and every main push's
            # critical path — 151-160s of it, most of the job's own wall time —
            # for a regression that reproduces only through the dagster
            # composition root, its lanes, the image it runs in, and its own
            # job definition. Narrower than `python` on purpose: ~95% of PR
            # diffs never touch any of this. docker-compose.yml matches
            # whole-file (paths-filter has no section-level match) even though
            # it defines no dedicated dagster service today — the closest
            # available proxy for the day it does, and it is why the entry
            # is also in `python` above.
            dagster_liveness:
              - 'apps/data-engine/**'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docker-compose.yml'
              - '.github/workflows/ci-python.yml'
            data_engine:
              - 'apps/data-engine/**'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'db/**'
              - 'pyproject.toml'
              - 'AGENTS.md'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci-python.yml'
              - '.github/workflows/ci-required.yml'
              - '.github/actions/**'
              - 'docker-compose.yml'
              - 'tools/**'
            web:
              - 'tools/**'
              - 'apps/app-web/**'
              - 'apps/llm-service/**'
              - 'common/contracts/**'
              - 'common/factors/**'
              - 'common/runtime/**'
              - 'db/**'
              - '.github/actions/**'
              - '.github/workflows/ci-web.yml'
              - '.github/workflows/ci-required.yml'
            # Positive build-input paths without `!` entries (#1412, #1647): docs and test edits
            # do not trigger container image builds on PRs.
            image_app_web:
              - 'apps/app-web/src/**'
              - 'apps/app-web/public/**'
              - 'apps/app-web/Dockerfile*'
              - 'apps/app-web/.dockerignore'
              - 'apps/app-web/package.json'
              - 'apps/app-web/bun.lock*'
              - 'apps/app-web/next.config.*'
              - 'apps/app-web/tsconfig.json'
              - 'apps/app-web/postcss.config.*'
              - 'apps/app-web/tailwind.config.*'
              - 'apps/app-web/required-env.manifest.json'
              - 'apps/app-web/openapi.json'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'
            image_llm_service:
              - 'apps/llm-service/src/**'
              - 'apps/llm-service/pyproject.toml'
              - 'apps/llm-service/Dockerfile*'
              - 'apps/llm-service/required-env.generated.json'
              - 'apps/data-engine/pyproject.toml'
              - 'common/contracts/src/**'
              - 'common/contracts/pyproject.toml'
              - 'common/factors/src/**'
              - 'common/factors/pyproject.toml'
              - 'common/runtime/src/**'
              - 'common/runtime/pyproject.toml'
              - 'db/migrations/**'
              - 'db/roles.sql'
              - 'db/apply_migrations.sh'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'
            image_data_engine:
              - 'apps/data-engine/src/**'
              - 'apps/data-engine/pyproject.toml'
              - 'apps/data-engine/Dockerfile*'
              - 'apps/data-engine/dagster.yaml'
              - 'apps/data-engine/dagster-entrypoint.sh'
              - 'apps/data-engine/required-env.generated.json'
              - 'apps/llm-service/pyproject.toml'
              - 'common/contracts/src/**'
              - 'common/contracts/pyproject.toml'
              - 'common/factors/src/**'
              - 'common/factors/pyproject.toml'
              - 'common/runtime/src/**'
              - 'common/runtime/pyproject.toml'
              - 'db/migrations/**'
              - 'db/roles.sql'
              - 'db/apply_migrations.sh'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'

  security:
    if: github.ref_type != 'tag'
    needs: changes
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-gate.yml

  db:
    if: needs.changes.outputs.db == 'true'
    needs: changes
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci-db.yml

  python:
    if: needs.changes.outputs.python == 'true'
    needs: changes
    uses: ./.github/workflows/ci-python.yml
    with:
      dagster_liveness_required: ${{ github.event_name != 'pull_request' || needs.changes.outputs.dagster_liveness == 'true' }}
      data_engine_required: ${{ github.event_name != 'pull_request' || needs.changes.outputs.data_engine == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      actions: write

  web:
    if: needs.changes.outputs.web == 'true'
    needs: changes
    uses: ./.github/workflows/ci-web.yml
    permissions:
      contents: read
      pull-requests: read
      actions: write

  images_build:
    if: >-
      github.ref_type != 'tag' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'merge_group' ||
       (github.event_name == 'pull_request' &&
        (needs.changes.outputs.image_app_web == 'true' ||
         needs.changes.outputs.image_llm_service == 'true' ||
         needs.changes.outputs.image_data_engine == 'true')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.force_images))
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/release-images.yml
    with:
      publish: false
      app_web: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.force_images) || needs.changes.outputs.image_app_web == 'true' }}
      llm_service: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.force_images) || needs.changes.outputs.image_llm_service == 'true' }}
      data_engine: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.force_images) || needs.changes.outputs.image_data_engine == 'true' }}

  images_release:
    if: >-
      always() &&
      github.ref_type != 'tag' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.force_images)) &&
      needs.changes.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      needs.images_build.result == 'success'
    needs: [changes, security, db, python, web, images_build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      publish: true
      app_web: true
      llm_service: true
      data_engine: true
      prebuilt: ${{ github.event_name == 'push' }}

  # A release tag reuses the main image of its commit; it builds nothing (#1878).
  images_promote:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: changes
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      publish: false
      promote: true
      app_web: true
      llm_service: true
      data_engine: true

  required:
    name: ci-required
    if: always()
    needs: [changes, security, db, python, web, images_build, images_release, images_promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any failed, cancelled, or missing dependency
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$RESULTS")"
          if [ -n "$failures" ]; then
            echo "Required CI dependencies did not pass:" >&2
            echo "$failures" >&2
            exit 1
          fi
          echo "All affected CI dependencies passed or were explicitly skipped."
