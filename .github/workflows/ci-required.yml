name: ci-required

# A release-tag push must produce the deterministic display_title declared in
# tools/production_evidence_policy.json ("Release Images {version_ref}") — infra2's
# production-evidence verification matches on it (#464 / infra2#576). Non-tag runs
# render an empty run-name, which GitHub replaces with the default title (the head
# commit message / PR title), so day-to-day runs are unchanged.
run-name: ${{ github.ref_type == 'tag' && format('Release Images {0}', github.ref_name) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      force_images:
        description: Publish all current-ref images after required checks.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# The group key carries the ref AND the event, so a tag PUSH is alone in its own
# group — which is what keeps `cancel-in-progress: true` safe here. The event is
# load-bearing, not decoration: without it a manual workflow_dispatch on the
# same tag ref shares the group and cancels the release run mid-publish
# (review). Two dispatches still cancel each other, which is what you want. Main pushes DO now collapse: measured over the last 14
# merges, 2 landed inside the ~6 min a main run takes, and each of those bursts
# put ~16 extra jobs in the queue that every open PR was waiting behind. The
# superseded run's verdict is not lost, only re-attributed: the newer run
# covers the older SHA's code too, and cut_release refuses to tag until main
# HEAD itself is green, so the evidence D2's tag_verified needs is always the
# run that survived.
concurrency:
  group: ci-required-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      db: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.db }}
      python: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.python }}
      qlib: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.qlib }}
      runtime: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.runtime }}
      web: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.web }}
      image_app_web: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_app_web }}
      image_llm_service: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_llm_service }}
      image_data_engine: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.image_data_engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        if: github.ref_type != 'tag' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              # ci-db executes tools/output_invariants.py against the migrated
              # schema; editing that tool must re-run it.
              - 'tools/**'
              - 'db/**'
              - '.github/workflows/ci-db.yml'
              - '.github/workflows/ci-required.yml'
            python:
              # tools/*.py are the deploy gates themselves; their tests live in
              # libs/runtime/tests via load_tool, which only ci-python runs. A
              # tools-only PR used to match NO filter, and `required` treats a
              # skipped job as success — so the gate tooling could merge with
              # zero tests executed (A4 review finding, #673).
              - 'tools/**'
              # Same class, one directory over, exposed by #689's own checks:
              # test_ci_workflows.py pins the SHAPE of deploy-release,
              # deploy-freshness, issue-close-guard and mutation-reproof — and a
              # PR editing those workflows matched no python filter, so the
              # tests that pin them were exactly the ones that did not run.
              - '.github/workflows/**'
              - 'apps/data-engine/**'
              - 'apps/llm-service/**'
              - 'libs/contracts/**'
              - 'libs/factors/**'
              - 'libs/runtime/**'
              - 'db/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci-python.yml'
              - '.github/workflows/ci-required.yml'
            qlib:
              - 'libs/factors/qlib-runtime/**'
              - 'libs/factors/src/factors/batches/issuer_strategy_selection_tiny/**'
              - 'libs/factors/src/factors/batches/qlib_expression_contract_tiny/**'
              - 'libs/factors/tests/batches/issuer_strategy_selection_tiny/**'
              - 'libs/factors/tests/batches/qlib_expression_contract_tiny/**'
              - '.github/workflows/ci-qlib.yml'
              - '.github/workflows/ci-required.yml'
            runtime:
              - 'docker-compose.yml'
              - '.env.example'
              - 'db/**'
              - 'libs/contracts/**'
              - 'libs/runtime/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci-runtime.yml'
              - '.github/workflows/ci-required.yml'
            web:
              # ci-web runs the app-web half of tools/check_route_manifest.py
              # and the walk seeds read tools/route_manifest.json.
              - 'tools/**'
              - 'apps/app-web/**'
              - 'libs/contracts/conformance/**'
              - '.github/workflows/ci-web.yml'
              - '.github/workflows/ci-required.yml'
            image_app_web:
              - 'apps/app-web/**'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'
            image_llm_service:
              - 'apps/llm-service/**'
              - 'apps/data-engine/pyproject.toml'
              - 'libs/contracts/**'
              - 'libs/factors/**'
              - 'libs/runtime/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'
            image_data_engine:
              - 'apps/data-engine/**'
              - 'libs/contracts/**'
              - 'libs/factors/**'
              - 'libs/runtime/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/release-images.yml'
              - '.github/workflows/ci-required.yml'

  # A4 D2 (#673): a tag names a SHA main already proved — ATTEST, do not re-run.
  # Measured: 11 tags in the August sprint each re-ran the full suite on an
  # identical, already-green SHA (~4-5 min apiece). The evidence contract is
  # untouched — the tag run keeps its workflow path, push event, tag
  # head_branch, "Release Images {tag}" title and success conclusion, so every
  # clause deploy-release and production_evidence_policy.json pin still holds
  # literally. What changes is the MEANING of this run's success: from "the
  # tests ran again on this ref" to "an identical-SHA green main run was
  # verified, and the images published". Strictly tighter in one case: a tag on
  # a SHA that never reached main used to re-run tests and could go green — now
  # it fails here, before any image is published.
  tag_verified:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Assert an identical-SHA green main run exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci-required.yml/runs?head_sha=${{ github.sha }}&branch=main&event=push&status=success&per_page=1" --jq '.total_count')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::tag ${{ github.ref_name }} points at ${{ github.sha }}, which has no green main-push ci-required run — either it never reached main or main was red at it. A tag attests to a verified SHA; this one cannot."
            exit 1
          fi
          echo "attested: main verified ${{ github.sha }} — a green push run exists for this exact SHA"

  security:
    needs: changes
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-gate.yml

  db:
    if: github.ref_type != 'tag' && needs.changes.outputs.db == 'true'
    needs: changes
    uses: ./.github/workflows/ci-db.yml

  python:
    if: github.ref_type != 'tag' && needs.changes.outputs.python == 'true'
    needs: changes
    uses: ./.github/workflows/ci-python.yml
    # ci-python/ci-qlib/ci-runtime all use `setup-uv` with `enable-cache: true`,
    # and a called workflow cannot exceed the caller's grant. Without `actions:
    # write` the cache RESTORES and cannot SAVE: harmless while the key keeps
    # hitting, and a hard job failure the first time the key changes. #645
    # changed uv.lock, and `Post Run astral-sh/setup-uv` began failing on every
    # run from that merge onward — every real step in the job green, the whole
    # job red. Latent since caching was enabled; my lockfile change is what lit
    # it (#616-adjacent, same shape: the step that reports the outcome broke
    # while the work it reports on was fine).
    permissions:
      contents: read
      pull-requests: read
      actions: write

  qlib:
    if: github.ref_type != 'tag' && needs.changes.outputs.qlib == 'true'
    needs: changes
    uses: ./.github/workflows/ci-qlib.yml
    # ci-python/ci-qlib/ci-runtime all use `setup-uv` with `enable-cache: true`,
    # and a called workflow cannot exceed the caller's grant. Without `actions:
    # write` the cache RESTORES and cannot SAVE: harmless while the key keeps
    # hitting, and a hard job failure the first time the key changes. #645
    # changed uv.lock, and `Post Run astral-sh/setup-uv` began failing on every
    # run from that merge onward — every real step in the job green, the whole
    # job red. Latent since caching was enabled; my lockfile change is what lit
    # it (#616-adjacent, same shape: the step that reports the outcome broke
    # while the work it reports on was fine).
    permissions:
      contents: read
      pull-requests: read
      actions: write

  runtime:
    if: github.ref_type != 'tag' && needs.changes.outputs.runtime == 'true'
    needs: changes
    uses: ./.github/workflows/ci-runtime.yml
    # ci-python/ci-qlib/ci-runtime all use `setup-uv` with `enable-cache: true`,
    # and a called workflow cannot exceed the caller's grant. Without `actions:
    # write` the cache RESTORES and cannot SAVE: harmless while the key keeps
    # hitting, and a hard job failure the first time the key changes. #645
    # changed uv.lock, and `Post Run astral-sh/setup-uv` began failing on every
    # run from that merge onward — every real step in the job green, the whole
    # job red. Latent since caching was enabled; my lockfile change is what lit
    # it (#616-adjacent, same shape: the step that reports the outcome broke
    # while the work it reports on was fine).
    permissions:
      contents: read
      pull-requests: read
      actions: write

  web:
    if: github.ref_type != 'tag' && needs.changes.outputs.web == 'true'
    needs: changes
    uses: ./.github/workflows/ci-web.yml

  images_check:
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      (needs.changes.outputs.image_app_web == 'true' ||
       needs.changes.outputs.image_llm_service == 'true' ||
       needs.changes.outputs.image_data_engine == 'true')
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/release-images.yml
    with:
      publish: false
      app_web: ${{ github.event_name == 'merge_group' || needs.changes.outputs.image_app_web == 'true' }}
      llm_service: ${{ github.event_name == 'merge_group' || needs.changes.outputs.image_llm_service == 'true' }}
      data_engine: ${{ github.event_name == 'merge_group' || needs.changes.outputs.image_data_engine == 'true' }}

  images_release:
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        (needs.changes.outputs.image_app_web == 'true' ||
         needs.changes.outputs.image_llm_service == 'true' ||
         needs.changes.outputs.image_data_engine == 'true' ||
         github.ref_type == 'tag')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.force_images)) &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.qlib.result == 'success' || needs.qlib.result == 'skipped') &&
      (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.tag_verified.result == 'success' || needs.tag_verified.result == 'skipped')
    needs: [changes, security, db, python, qlib, runtime, web, tag_verified]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      publish: true
      app_web: true
      llm_service: true
      data_engine: true

  required:
    name: ci-required
    if: always()
    needs: [changes, security, db, python, qlib, runtime, web, images_check, images_release, tag_verified]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any failed, cancelled, or missing dependency
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$RESULTS")"
          if [ -n "$failures" ]; then
            echo "Required CI dependencies did not pass:" >&2
            echo "$failures" >&2
            exit 1
          fi
          echo "All affected CI dependencies passed or were explicitly skipped."
