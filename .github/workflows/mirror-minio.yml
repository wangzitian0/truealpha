name: mirror-minio

# MinIO discontinued free/anonymous container and binary distribution (confirmed
# 2026-09-24: quay.io/minio/minio requires auth even to list tags, Docker Hub's
# minio/minio repository is gone, Bitnami's mirror is gone, dl.min.io returns 410 Gone
# pointing only at the licensed commercial product). truealpha#1041. The AGPLv3 source
# remains public on GitHub, so this builds the exact pinned release from source once and
# publishes it to this repository's own GHCR, so ci-python.yml's anonymous `docker run`
# pull has something real to pull. Manual only: this mirrors a fixed historical release,
# not a recurring feed, so there is nothing for a schedule to pick up.
on:
  workflow_dispatch:
    inputs:
      minio_release_tag:
        description: 'MinIO server release tag to build from source (e.g. RELEASE.2025-09-07T16-13-09Z)'
        required: false
        type: string
      mc_release_tag:
        description: 'MinIO Client (mc) release tag to build from source (e.g. RELEASE.2025-08-13T08-35-41Z)'
        required: false
        type: string
  # Bootstrap only: workflow_dispatch requires the workflow file to already exist on the
  # default branch. Builds mc only (minio is already mirrored); removed once verified.
  push:
    branches: [issue1041-minio-mirror]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-minio:
    if: inputs.minio_release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINIO_RELEASE_TAG: ${{ inputs.minio_release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/mirrors/minio
          build-args: |
            MINIO_RELEASE_TAG=${{ env.MINIO_RELEASE_TAG }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/minio-mirror:${{ env.MINIO_RELEASE_TAG }}
          provenance: false
      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/minio-mirror:${{ env.MINIO_RELEASE_TAG }}" --format '{{json .Manifest}}' | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed ghcr.io/${{ github.repository_owner }}/minio-mirror:${{ env.MINIO_RELEASE_TAG }}@$DIGEST"
      - name: Verify the image is anonymously pullable (matches ci-python.yml's unauthenticated docker run)
        run: |
          docker logout ghcr.io
          docker pull "ghcr.io/${{ github.repository_owner }}/minio-mirror@${{ steps.digest.outputs.digest }}" \
            || { echo "::error::Package is not public yet -- flip visibility to Public in GHCR package settings, then re-run this verification." >&2; exit 1; }
      - name: Verify it actually runs as a healthy MinIO server, from inside the container
        # docker-compose.yml's healthcheck runs `curl` inside the container itself, not
        # from the host -- a pull succeeding and a host-side curl succeeding both missed
        # a base image with no curl binary. Same command that flagged it (#1041).
        run: |
          docker run -d --name minio-verify -p 9000:9000 \
            -e MINIO_ROOT_USER=verify -e MINIO_ROOT_PASSWORD=verify_local_secret \
            "ghcr.io/${{ github.repository_owner }}/minio-mirror@${{ steps.digest.outputs.digest }}" server /data
          for attempt in $(seq 1 30); do
            docker exec minio-verify curl -f http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "::error::Container never became healthy" >&2
          docker logs minio-verify >&2
          exit 1

  build-and-push-mc:
    if: inputs.mc_release_tag != '' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MC_RELEASE_TAG: ${{ inputs.mc_release_tag || 'RELEASE.2025-08-13T08-35-41Z' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/mirrors/mc
          build-args: |
            MC_RELEASE_TAG=${{ env.MC_RELEASE_TAG }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mc-mirror:${{ env.MC_RELEASE_TAG }}
          provenance: false
      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/mc-mirror:${{ env.MC_RELEASE_TAG }}" --format '{{json .Manifest}}' | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed ghcr.io/${{ github.repository_owner }}/mc-mirror:${{ env.MC_RELEASE_TAG }}@$DIGEST"
      - name: Verify it is anonymously pullable and actually runs
        run: |
          docker logout ghcr.io
          docker pull "ghcr.io/${{ github.repository_owner }}/mc-mirror@${{ steps.digest.outputs.digest }}" \
            || { echo "::error::Package is not public yet -- flip visibility to Public in GHCR package settings, then re-run this verification." >&2; exit 1; }
          docker run --rm "ghcr.io/${{ github.repository_owner }}/mc-mirror@${{ steps.digest.outputs.digest }}" --version
