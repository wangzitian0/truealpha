name: mutation-reproof

# #582, and the LAST new workflow. Everything after this is a function in an
# existing file or a row in an existing table.
#
# Rule 7 asks for an acceptance criterion to be shown red once. That proves the
# assertion worked the day it was written: assertFunnelSaysSomething was
# red-proven and still used node.parentElement, which a later <header> wrapper
# would have made pass vacuously. Six defects of that shape shipped or nearly
# shipped in the 2026-08 work, each an assertion that looked right and checked
# nothing, and every file-reading test passed on all six.
#
# So each week: break the property, require the guard to notice, restore. The
# only output is which guards have gone inert.

on:
  schedule:
    # Monday 06:00 UTC — before a working week, so an inert guard is found
    # before it is relied on rather than after.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # A4 D4a (#673): a dead guard used to wait up to 7 days to be noticed. The
  # PRs that can deaden one are exactly those touching a mutated file, its
  # guard, the manifest, or this harness — so those PRs, and only those, pay
  # the ~2-4 min re-proof at review time instead. The path list is the exact
  # union of tools/mutations.json's file+guard sets, NOT a directory glob: a
  # glob would put this job on most PRs' critical path and undo D3's 3-minute
  # wall. libs/runtime/tests/test_ci_workflows.py fails when the manifest
  # names a file this list misses, so the filter cannot rot silently.
  pull_request:
    paths:
      - ".github/workflows/deploy-release.yml"
      - "apps/app-web/src/app/login/page.tsx"
      - "apps/app-web/src/app/research/coverage/page.tsx"
      - "apps/app-web/src/app/research/rankings/page.tsx"
      - "apps/app-web/src/server/admin/ops.ts"
      - "apps/app-web/src/server/mart/research-read.ts"
      - "apps/app-web/src/server/mart/strategy-run-repository.ts"
      - "apps/app-web/tests/route-tree-freeze.test.ts"
      - "apps/app-web/tests/source-contracts.test.ts"
      - "apps/data-engine/src/data_engine/datahub/strategy_bridge.py"
      - "db/migrations/0043_strategy_input_fiscal_period.sql"
      - "libs/contracts/src/truealpha_contracts/fiscal_period.py"
      - "libs/contracts/tests/test_fiscal_period.py"
      - "libs/factors/src/factors/base/peg.py"
      - "libs/runtime/tests/test_ci_workflows.py"
      - "libs/runtime/tests/test_migration_chain.py"
      - "libs/runtime/tests/test_output_invariants.py"
      - "tools/check_factor_contract.py"
      - "tools/factor_contract.json"
      - "tools/mutation_reproof.py"
      - "tools/mutations.json"
      - "tools/output_invariants.py"

concurrency:
  group: mutation-reproof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - working-directory: apps/app-web
        run: bun install --frozen-lockfile
      # Every mutation restores its file, but the checkout is throwaway either
      # way — a run killed mid-edit cannot leave the repository altered.
      - name: Break each declared property and require its guard to notice
        run: uv run --no-sync python tools/mutation_reproof.py
