name: ci-web

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/app-web
    # Real Postgres so the DB-backed tests RUN here instead of skipping (#468).
    # Mirrors ci-python: same image, same migrations, same arming contract.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # #463: every route must fall inside its service's declared prefixes in
      # tools/route_manifest.json, and no two services' prefixes may overlap —
      # the shadowing class that broke login on staging AND production had no
      # in-repo tripwire. Stdlib-only; also runs in ci-python for the
      # llm-service side.
      - name: Route-namespace manifest
        working-directory: .
        run: python3 tools/check_route_manifest.py
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Apply DB migrations and roles
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          # #580: a second database, migrated identically and left empty, so
          # the browser suite can walk the absent-state branch of every surface.
          createdb -h localhost -U postgres truealpha_empty
          for db in truealpha truealpha_empty; do
            for f in db/migrations/*.sql db/roles.sql; do
              echo "== $db $f"
              psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 -f "$f"
            done
          done
      # Runs every tests/*.test.ts file, not just one hardcoded name — #373
      # found that only issue58-conformance.test.ts was ever invoked here,
      # so the other 13 (auth, conversations, documents, dashboard, route-group
      # boundary scans, etc.) silently never ran in CI despite passing locally.
      #
      # TRUEALPHA_REQUIRE_RUNTIME=1 arms every DB guard: a test that cannot
      # reach the Postgres service above must FAIL, not skip (#468). The grep
      # gate below is the backstop for any future test that skips without
      # honoring the arming variable — the convention is that a skip branch
      # prints a line ending in "— SKIP", and no such line may appear here.
      - name: Run tests (DB-backed tests armed)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
          TRUEALPHA_REQUIRE_RUNTIME: "1"
        run: |
          set -euo pipefail
          for f in tests/*.test.ts; do
            echo "== $f"
            bun run "$f"
          done 2>&1 | tee /tmp/ci-web-tests.log
          if grep -F -- "— SKIP" /tmp/ci-web-tests.log; then
            echo "::error::a test printed a skip marker; the Postgres service exists so integration tests must RUN in CI" >&2
            exit 1
          fi
      # #581: whether a published number is possible at all. Runs here against
      # the seeded fixture, which cannot populate every plane — the tool prints
      # which invariants examined zero rows rather than reporting "ok" over an
      # empty set, and `--require-coverage` is deliberately NOT passed here.
      - name: Output invariants (seeded fixture)
        working-directory: .
        run: |
          uv run --no-sync python tools/output_invariants.py \
            --database-url postgresql://postgres:postgres@localhost:5432/truealpha

      - run: bun run build

      # #494 criterion 1: the frozen route tree, walked in a real browser, on
      # every push — not once by hand. Before this, e2e/walk-tree.mjs was
      # checked in, passing, and referenced by no workflow and no Makefile
      # target, so deleting the OPERATE chrome or a claim-ceiling banner merged
      # green. The three properties it asserts are the ones #494 exists to
      # protect; this is where they stop being a July screenshot.
      - name: Install chromium for the walk-tree suite
        run: bunx playwright install --with-deps chromium
      # The seed is about what the walk COVERS, not about whether it passes —
      # measured, not assumed. On a migrated database with principals but no
      # mart rows the suite is green (11/11), because every research surface
      # renders an `unavailable` notice and the claim ceiling is unconditional
      # on both strategy-output pages. Green over four words is not coverage:
      # assertion (a) has no rendered entity to scan, and every assertion the
      # stacked issues add (#371 nav membership, #540 sign-out) would walk empty
      # pages. seed-e2e-fixture.ts loads the frozen twin-parity canon (#482) so
      # the surfaces reach `ready` on the same bytes the parity test asserts,
      # plus the member/administrator principals the route-group gates
      # discriminate on.
      - name: Seed the e2e fixtures (populated and empty)
        run: |
          set -euo pipefail
          E2E_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          export E2E_PASSWORD
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/truealpha \
            bun run scripts/seed-e2e-fixture.ts
          # The same principals, no mart rows: the login the walk needs, and
          # nothing else, so every surface renders its absent state (#580).
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/truealpha_empty \
            bun run scripts/seed-e2e-fixture.ts --principals-only
      # `output: "standalone"` (next.config.mjs) does not copy .next/static, so
      # the server 404s every asset without this.
      #
      # NODE_ENV=production is set EXPLICITLY rather than relied on: the whole
      # point of walking a standalone build is that the suite sees deployed-mode
      # behaviour, and several paths key off it — auth/config.ts refuses both an
      # unset SECRET_KEY and the pasted dev default only in production
      # (#447/#481). Depending on whatever the generated server happens to set
      # would make that a claim rather than a property (review).
      # #580: the SAME suite, twice, against two data states. Every UI defect
      # the 2026-07 review found was in the absent-state branch — the claim
      # ceiling dropped when no run existed (#551), the run table drew a bare
      # header when the list was empty (#554), the funnel vanished when it could
      # not be computed (#554). The suite was green throughout, because it only
      # ever walked the branch whoever wrote the page was looking at.
      #
      # One step with a loop rather than two near-identical steps: the
      # duplication would be the same class of thing #583/#584/#585 just
      # deleted. The `::error::` names the state, so a red run identifies the
      # branch from the summary without opening a log.
      - name: Walk the frozen route tree in a browser (populated and empty)
        env:
          TA_BASE_URL: http://127.0.0.1:3000
          TA_EMAIL: admin@e2e.invalid
          # #371: the member pass. Both principals are seeded with the same
          # throwaway password, so one TA_PASSWORD covers both identities.
          TA_MEMBER_EMAIL: member@e2e.invalid
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          # Set once, updated per iteration: with `set -e`, a failure between
          # starting a server and the explicit kill — the readiness curl below is
          # the reachable one — would otherwise leave it holding port 3000, and
          # the NEXT iteration would fail to bind for a reason unrelated to what
          # it walks. The trap the single-state version had was lost in the
          # conversion to a loop (review).
          server_pid=""
          trap 'kill "${server_pid:-}" 2>/dev/null || true' EXIT
          for state in populated empty; do
            database=truealpha
            [ "$state" = empty ] && database=truealpha_empty
            echo "::group::walk against the ${state} database"
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${database}" \
              SECRET_KEY="$(openssl rand -hex 32)" NODE_ENV=production \
              NEXT_TELEMETRY_DISABLED=1 HOSTNAME=127.0.0.1 PORT=3000 \
              node .next/standalone/server.js &
            server_pid=$!
            for _ in $(seq 1 60); do
              curl -fsS -o /dev/null "$TA_BASE_URL/login" && break
              sleep 1
            done
            curl -fsS -o /dev/null "$TA_BASE_URL/login"
            if ! TA_PASSWORD="$E2E_PASSWORD" node e2e/walk-tree.mjs; then
              echo "::error::the walk failed against the ${state} database. A failure here only \
          on ${state} means the page handles one data state and not the other — the shape of \
          every UI defect #580 was opened for."
              kill "$server_pid" 2>/dev/null || true
              exit 1
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            server_pid=""
            echo "::endgroup::"
          done
