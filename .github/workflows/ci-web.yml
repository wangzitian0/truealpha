name: ci-web

on:
  workflow_call:

# A4 (#673): two jobs, not one. The single `check` job was 168 s and a
# typecheck error surfaced only after build + chromium + two browser walks had
# also run. Splitting puts every cheap verdict first: a type error or a failing
# DB test now reports at ~70 s instead of ~170 s, which is the fast-failure
# half of the speed work. The green-path wall barely moves — on the current
# profile data-engine (161 s) and the liveness soak (158 s) are co-equal poles
# — and that is stated here rather than claimed away.
#
# Both jobs pay their own Postgres and `bun install`; the alternative is an
# artifact hand-off costing about what it saves.
jobs:
  # Everything that can fail without a browser, so its verdict is the one a red
  # PR shows soonest.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Narrowed back down. The caller's grant is a ceiling for the WHOLE called
    # workflow, not for the job that needs it: ci-required's web job now grants
    # `actions: write` so `browser` can save the chromium cache, and without
    # this block that token would also be held by a job whose main act is
    # `bun install` from a lockfile (review). ci-python/ci-runtime never hit
    # this because they are single-job.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/app-web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: make typecheck-web
        working-directory: .
      - name: Run zero-DB unit tests
        working-directory: .
        run: make test-web

  # The browser half: a production build, then the frozen route tree walked
  # against two data states.
  browser:
    runs-on: ubuntu-24.04  # not ubuntu-latest: Playwright cannot install chromium on 26.04
    timeout-minutes: 20
    # The only job here that needs it: actions/cache cannot SAVE read-only.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: apps/app-web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - run: uv sync --package truealpha-llm-service --frozen
        working-directory: .
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply the migration chain (populated and empty)
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          # #580: a second database, migrated identically and left empty, so
          # the browser suite can walk the absent-state branch of every surface.
          # The loop is over DATABASES; the chain itself is applied by the one
          # applier every call site shares (#984).
          createdb -h localhost -U postgres truealpha_empty
          for db in truealpha truealpha_empty; do
            echo "== $db"
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db" sh db/apply_migrations.sh
          done
      - run: bun run build

      # #494 criterion 1: the frozen route tree, walked in a real browser, on
      # every push — not once by hand. Before this, e2e/walk-tree.mjs was
      # checked in, passing, and referenced by no workflow and no Makefile
      # target, so deleting the OPERATE chrome or a claim-ceiling banner merged
      # green. The three properties it asserts are the ones #494 exists to
      # protect; this is where they stop being a July screenshot.
      # 19 s per run, unchanged between runs unless the playwright pin moves.
      # The key is the LOCKFILE hash, not a version string parsed out of it: a
      # parse is one rename away from keying on a constant, and a cache key
      # that never changes is a cache that serves a stale browser forever.
      # Requires `actions: write` on the caller's web job — without it this
      # restores, never saves, and reports success while doing nothing.
      - name: Restore chromium
        id: chromium_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/app-web/bun.lock', 'apps/app-web/bun.lockb', 'apps/app-web/package.json') }}
      - name: Install chromium for the walk-tree suite
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      # The seed is about what the walk COVERS, not about whether it passes —
      # measured, not assumed. On a migrated database with principals but no
      # mart rows the suite is green (11/11), because every research surface
      # renders an `unavailable` notice and the claim ceiling is unconditional
      # on both strategy-output pages. Green over four words is not coverage:
      # assertion (a) has no rendered entity to scan, and every assertion the
      # stacked issues add (#371 nav membership, #540 sign-out) would walk empty
      # pages. seed-e2e-fixture.ts loads the frozen twin-parity canon (#482) so
      # the surfaces reach `ready` on the same bytes the parity test asserts,
      # plus the member/administrator principals the route-group gates
      # discriminate on.
      - name: Seed the e2e fixtures (populated and empty)
        working-directory: .
        run: |
          set -euo pipefail
          E2E_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          export E2E_PASSWORD
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/truealpha \
            uv run --package truealpha-llm-service python apps/llm-service/scripts/seed_e2e_fixture.py
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/truealpha_empty \
            uv run --package truealpha-llm-service python apps/llm-service/scripts/seed_e2e_fixture.py --principals-only
      # `output: "standalone"` (next.config.mjs) does not copy .next/static, so
      # the server 404s every asset without this.
      #
      # NODE_ENV=production is set EXPLICITLY rather than relied on: the whole
      # point of walking a standalone build is that the suite sees deployed-mode
      # behaviour, and several paths key off it — auth/config.ts refuses both an
      # unset SECRET_KEY and the pasted dev default only in production
      # (#447/#481). Depending on whatever the generated server happens to set
      # would make that a claim rather than a property (review).
      # #580: the SAME suite, twice, against two data states. Every UI defect
      # the 2026-07 review found was in the absent-state branch — the claim
      # ceiling dropped when no run existed (#551), the run table drew a bare
      # header when the list was empty (#554), the funnel vanished when it could
      # not be computed (#554). The suite was green throughout, because it only
      # ever walked the branch whoever wrote the page was looking at.
      #
      # One step with a loop rather than two near-identical steps: the
      # duplication would be the same class of thing #583/#584/#585 just
      # deleted. The `::error::` names the state, so a red run identifies the
      # branch from the summary without opening a log.
      - name: Walk the frozen route tree in a browser (populated and empty)
        env:
          TA_BASE_URL: http://127.0.0.1:3000
          TA_EMAIL: admin@e2e.invalid
          # #371: the member pass. Both principals are seeded with the same
          # throwaway password, so one TA_PASSWORD covers both identities.
          TA_MEMBER_EMAIL: member@e2e.invalid
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          # Set once, updated per iteration: with `set -e`, a failure between
          # starting a server and the explicit kill — the readiness curl below is
          # the reachable one — would otherwise leave it holding port 3000, and
          # the NEXT iteration would fail to bind for a reason unrelated to what
          # it walks. The trap the single-state version had was lost in the
          # conversion to a loop (review).
          server_pid=""
          backend_pid=""
          cleanup() {
            if [ -n "${server_pid:-}" ]; then kill -TERM -"${server_pid}" "${server_pid}" 2>/dev/null || true; fi
            if [ -n "${backend_pid:-}" ]; then kill -TERM -"${backend_pid}" "${backend_pid}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          SESSION_SECRET="$(openssl rand -hex 32)"
          for state in populated empty; do
            database=truealpha
            [ "$state" = empty ] && database=truealpha_empty
            echo "::group::walk against the ${state} database"
            (
              cd "${GITHUB_WORKSPACE}" && \
              ENVIRONMENT=ci SECRET_KEY="$SESSION_SECRET" DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${database}" \
                exec setsid uv run --package truealpha-llm-service uvicorn llm_service.main:app --host 127.0.0.1 --port 8000
            ) &
            backend_pid=$!
            for _ in $(seq 1 30); do
              curl -fsS -o /dev/null "http://127.0.0.1:8000/health" && break
              sleep 1
            done
            curl -fsS -o /dev/null "http://127.0.0.1:8000/health"
            setsid env LLM_SERVICE_URL="http://127.0.0.1:8000" NODE_ENV=production \
              NEXT_TELEMETRY_DISABLED=1 HOSTNAME=127.0.0.1 PORT=3000 \
              node .next/standalone/server.js &
            server_pid=$!
            for _ in $(seq 1 60); do
              curl -fsS -o /dev/null "$TA_BASE_URL/login" && break
              sleep 1
            done
            curl -fsS -o /dev/null "$TA_BASE_URL/login"
            require_race=0
            [ "$state" = populated ] && require_race=1
            if ! TA_PASSWORD="$E2E_PASSWORD" TA_DATA_STATE="$state" TA_REQUIRE_RACE="$require_race" node e2e/walk-tree.mjs; then
              echo "::error::the walk failed against the ${state} database."
              cleanup
              exit 1
            fi
            cleanup
            wait "$server_pid" "$backend_pid" 2>/dev/null || true
            for _ in $(seq 1 15); do
              if ! curl -fsS -o /dev/null "http://127.0.0.1:8000/health" && ! curl -fsS -o /dev/null "$TA_BASE_URL/login"; then
                break
              fi
              sleep 1
            done
            ! curl -fsS -o /dev/null "http://127.0.0.1:8000/health"
            ! curl -fsS -o /dev/null "$TA_BASE_URL/login"
            server_pid=""
            backend_pid=""
            echo "::endgroup::"
          done
