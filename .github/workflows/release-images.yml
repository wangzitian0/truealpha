name: release-images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the exact caller SHA after every image builds.
        required: true
        type: boolean
      # #860: a tag names a SHA main already published (#731's sha-<short> tags). With this
      # on, `plan` asks the registry which of the selected images main published at this
      # exact SHA; those are re-tagged at their digest by `retag` and never enter the
      # build/publish matrix. Images main did not publish at this SHA (#731 skips an image
      # the merge left untouched) still build and publish exactly as before. Off for a main
      # push and the manual force, which ARE the publisher.
      reuse_verified_sha:
        description: Re-tag the digests main already published for this exact SHA instead of rebuilding them.
        required: false
        type: boolean
        default: false
      app_web:
        description: Build the app-web image when its inputs changed.
        required: true
        type: boolean
      llm_service:
        description: Build the llm-service image when its inputs changed.
        required: true
        type: boolean
      data_engine:
        description: Build the data-engine image when its inputs changed.
        required: true
        type: boolean

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
      retag_matrix: ${{ steps.matrix.outputs.retag_matrix }}
      has_retag: ${{ steps.matrix.outputs.has_retag }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Select available images
        env:
          APP_WEB: ${{ inputs.app_web }}
          LLM_SERVICE: ${{ inputs.llm_service }}
          DATA_ENGINE: ${{ inputs.data_engine }}
          REUSE_VERIFIED_SHA: ${{ inputs.reuse_verified_sha }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          images='[]'
          if [[ "$APP_WEB" == "true" ]]; then
            images="$(jq -c '. + [{"image":"truealpha-app-web","dockerfile":"apps/app-web/Dockerfile","context":"apps/app-web"}]' <<< "$images")"
          fi
          if [[ "$LLM_SERVICE" == "true" ]]; then
            images="$(jq -c '. + [{"image":"truealpha-llm-service","dockerfile":"apps/llm-service/Dockerfile","context":"."}]' <<< "$images")"
          fi
          if [[ "$DATA_ENGINE" == "true" && -f apps/data-engine/Dockerfile ]]; then
            images="$(jq -c '. + [{"image":"truealpha-data-engine","dockerfile":"apps/data-engine/Dockerfile","context":"."}]' <<< "$images")"
          fi

          # #860: on a tag, what main already published at this SHA is re-tagged, not
          # rebuilt. The tool's stderr says which way each image went and why; a registry
          # answer other than "digest" or "no such tag" fails the run here rather than
          # quietly rebuilding everything (a slower green nobody would notice).
          retag='[]'
          if [[ "$REUSE_VERIFIED_SHA" == "true" ]]; then
            split="$(python3 tools/verified_sha_images.py --owner "$OWNER" --sha "$SHA" <<< "$images")"
            images="$(jq -c '.build' <<< "$split")"
            retag="$(jq -c '.retag' <<< "$split")"
          fi

          echo "matrix=$(jq -cn --argjson include "$images" '{include: $include}')" >> "$GITHUB_OUTPUT"
          if [[ "$(jq 'length' <<< "$images")" -gt 0 ]]; then
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          fi
          echo "retag_matrix=$(jq -cn --argjson include "$retag" '{include: $include}')" >> "$GITHUB_OUTPUT"
          if [[ "$(jq 'length' <<< "$retag")" -gt 0 ]]; then
            echo "has_retag=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_retag=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: needs.plan.outputs.has_images == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: inputs.publish && needs.plan.outputs.has_images == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern=v{{version}}
      - name: Publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  # #860: a tag run measured 2.2 min, all of it re-producing images its SHA already had --
  # three builds from a warm cache (~3 s each) and three publishes (~1 min each) that minted
  # a SECOND digest of the same bytes and moved main's own sha-<short> pointer onto it in
  # passing. `plan` asked the registry which images main published at this exact SHA; this
  # job points the release tag at those digests and touches nothing else. buildx re-pushes a
  # single source's original manifest bytes unchanged (util/imagetools/create.go: "on single
  # source, return original bytes"), so the tag names main's digest exactly -- asserted after
  # the push, per tag, because a re-tag that resolved to anything else would be a different
  # image wearing the release's name. Equivalent for every consumer: infra2 resolves the tag
  # to a digest at deploy time (20.data_engine/deploy.py) or pulls by tag (10.app), and
  # tools/health_check.py resolves the same tag the same way; nothing reads OCI labels.
  retag:
    if: inputs.publish && needs.plan.outputs.has_retag == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.retag_matrix) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same tag scheme as `publish`, from the same action, so the two paths cannot
      # drift: on a tag this yields the vX.Y.Z tag and the sha-<short> tag (which already
      # names this digest -- re-pushing it is a no-op that keeps main's pointer where main
      # put it), never `latest`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern=v{{version}}
      - name: Re-tag ${{ matrix.image }} at the digest main published
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ matrix.digest }}
          DIGEST: ${{ matrix.digest }}
          PUBLISHED_AS: ${{ matrix.source }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::metadata-action produced no tags for this ref — nothing to re-tag" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            resolved="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            if [ "$resolved" != "$DIGEST" ]; then
              echo "::error::$tag resolves to $resolved, not the verified $DIGEST main published as $PUBLISHED_AS" >&2
              exit 1
            fi
            echo "$tag -> $resolved (main published it as $PUBLISHED_AS)"
          done <<< "$TAGS"
