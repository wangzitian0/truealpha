name: release-images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the exact caller SHA after every image builds.
        required: true
        type: boolean
      app_web:
        description: Build the app-web image when its inputs changed.
        required: true
        type: boolean
      llm_service:
        description: Build the llm-service image when its inputs changed.
        required: true
        type: boolean
      data_engine:
        description: Build the data-engine image when its inputs changed.
        required: true
        type: boolean
      prebuilt:
        description: The caller already built, smoke-tested, and pushed ci-sha candidate images at this SHA; skip the build job.
        required: false
        type: boolean
        default: false
      publish_candidate:
        description: Push an immutable ci-sha candidate image during build so publish can retag without rebuilding.
        required: false
        type: boolean
        default: false
      promote:
        description: Point the caller's release tag at the published main image of the same commit; build nothing.
        required: false
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Select available images
        env:
          APP_WEB: ${{ inputs.app_web }}
          LLM_SERVICE: ${{ inputs.llm_service }}
          DATA_ENGINE: ${{ inputs.data_engine }}
        run: |
          set -euo pipefail
          images='[]'
          if [[ "$APP_WEB" == "true" ]]; then
            images="$(jq -c '. + [{"image":"truealpha-app-web","dockerfile":"apps/app-web/Dockerfile","context":"apps/app-web"}]' <<< "$images")"
          fi
          if [[ "$LLM_SERVICE" == "true" ]]; then
            images="$(jq -c '. + [{"image":"truealpha-llm-service","dockerfile":"apps/llm-service/Dockerfile","context":"."}]' <<< "$images")"
          fi
          if [[ "$DATA_ENGINE" == "true" && -f apps/data-engine/Dockerfile ]]; then
            images="$(jq -c '. + [{"image":"truealpha-data-engine","dockerfile":"apps/data-engine/Dockerfile","context":"."}]' <<< "$images")"
          fi

          echo "matrix=$(jq -cn --argjson include "$images" '{include: $include}')" >> "$GITHUB_OUTPUT"
          if [[ "$(jq 'length' <<< "$images")" -gt 0 ]]; then
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: needs.plan.outputs.has_images == 'true' && !inputs.prebuilt && !inputs.promote
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # setup-buildx pulls moby/buildkit from Docker Hub, which has no mirror on GHCR. On
      # 2026-09-16 a TLS handshake timeout there failed main's data-engine publish (run
      # 35076694921) with every test green; a re-run 8 min later passed. One delayed retry
      # absorbs that class instead of turning main red and filing an alert for it.
      - id: buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true
      - if: steps.buildx.outcome == 'failure'
        run: sleep 20
      - if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
      - name: Resolve candidate ref
        if: inputs.publish_candidate || inputs.publish
        id: candidate
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]' | cut -c1-7)"
          echo "ref=${repo_lc}:ci-sha-${short_sha}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: inputs.publish_candidate || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push candidate ${{ matrix.image }}
        if: inputs.publish_candidate || inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.candidate.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Pull candidate ${{ matrix.image }} for smoke tests
        if: inputs.publish_candidate || inputs.publish
        run: |
          set -euo pipefail
          docker pull "${{ steps.candidate.outputs.ref }}"
          docker tag "${{ steps.candidate.outputs.ref }}" "ci-image-check/${{ matrix.image }}:build"
      - name: Build ${{ matrix.image }}
        if: "!inputs.publish_candidate && !inputs.publish"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ci-image-check/${{ matrix.image }}:build
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # infra2 runs /app/dagster-entrypoint.sh from this image (Refs wangzitian0/infra2#1822).
      - name: Check the data-engine image carries an executable entrypoint and loads definitions
        if: matrix.image == 'truealpha-data-engine'
        run: |
          docker run --rm --entrypoint test ci-image-check/truealpha-data-engine:build -x /app/dagster-entrypoint.sh
          docker run --rm --entrypoint cat ci-image-check/truealpha-data-engine:build /app/dagster-entrypoint.sh \
            | cmp - apps/data-engine/dagster-entrypoint.sh
          docker run --rm --entrypoint python ci-image-check/truealpha-data-engine:build \
            -c "import data_engine.dagster_defs as m; jobs = list(m.defs.jobs); assert len(jobs) >= 1, jobs; print('data-engine defs ok:', len(jobs))"
      - name: Smoke-test truealpha-llm-service container boot
        if: matrix.image == 'truealpha-llm-service'
        run: |
          set -euo pipefail
          docker run --rm -e ENVIRONMENT=ci --entrypoint python ci-image-check/truealpha-llm-service:build \
            -c "import llm_service.main as m; assert m.ENV_MANIFEST_PATH.is_file(); print('llm-service import ok')"
          cid="$(docker run -d -e ENVIRONMENT=ci -p 127.0.0.1:18000:8000 --entrypoint uvicorn \
            ci-image-check/truealpha-llm-service:build llm_service.main:app --host 0.0.0.0 --port 8000)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/livez >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::truealpha-llm-service failed /livez container smoke" >&2
          docker logs "$cid" >&2 || true
          exit 1
      - name: Smoke-test truealpha-app-web container boot
        if: matrix.image == 'truealpha-app-web'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh ci-image-check/truealpha-app-web:build \
            -c 'test -f /app/server.js && test -n "$(ls -A /app/.next/static)"'
          smoke_secret="$(openssl rand -hex 32)"
          cid="$(docker run -d -e HOSTNAME=0.0.0.0 -e PORT=3000 -e LLM_SERVICE_URL=http://127.0.0.1:8000 \
            -e SECRET_KEY="$smoke_secret" \
            -p 127.0.0.1:13000:3000 ci-image-check/truealpha-app-web:build)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if body="$(curl -fsS http://127.0.0.1:13000/login)" && grep -q "Sign in" <<<"$body"; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::truealpha-app-web failed /login container smoke" >&2
          docker logs "$cid" >&2 || true
          exit 1

  # `!cancelled()` rather than the implicit success(): with `prebuilt` the build job is
  # skipped by design, and a job that `needs` a skipped job is itself skipped unless its
  # condition says otherwise. The condition then spells out the only two ways in: every
  # image built and pushed its candidate here, or the caller vouched for the build and none
  # ran here. Promote/retag the exact ci-sha candidate digest without rebuilding.
  publish:
    if: >-
      !cancelled() && inputs.publish && !inputs.promote && needs.plan.outputs.has_images == 'true' &&
      (needs.build.result == 'success' || (inputs.prebuilt && needs.build.result == 'skipped'))
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote candidate ${{ matrix.image }} to release tags
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]' | cut -c1-7)"
          source_ref="${repo_lc}:ci-sha-${short_sha}"
          if ! docker buildx imagetools inspect "$source_ref" >/dev/null 2>&1; then
            echo "::error::${source_ref} is not published; build must push candidate first" >&2
            exit 1
          fi
          tag_args=(--tag "${repo_lc}:sha-${short_sha}" --tag "${repo_lc}:${short_sha}")
          if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
            tag_args+=(--tag "${repo_lc}:latest")
          fi
          docker buildx imagetools create "${tag_args[@]}" "$source_ref"
          docker buildx imagetools inspect "${repo_lc}:sha-${short_sha}" >/dev/null

  # A release tag gets the bytes that main published and the preview gate tested (#1878).
  # A rebuild here gave the tag a new, untested digest and moved the sha tag to it.
  promote:
    if: inputs.promote && needs.plan.outputs.has_images == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point ${{ github.ref_name }} at the main image of ${{ github.sha }}
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]' | cut -c1-7)"
          source_ref="${repo_lc}:sha-${short_sha}"
          target_ref="${repo_lc}:${GITHUB_REF_NAME}"
          found=""
          for attempt in $(seq 1 20); do
            if docker buildx imagetools inspect "$source_ref" >/dev/null 2>&1; then
              found=1
              break
            fi
            if [ "$attempt" -lt 20 ]; then
              sleep 30
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::${source_ref} is not published; main must publish it first" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$target_ref" "$source_ref"
          docker buildx imagetools inspect "$target_ref" >/dev/null
