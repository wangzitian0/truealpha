name: doc-drift

# #1410 W1: every tracked Markdown file cites only repository paths and `mart` objects that
# exist on main, and holds no "Status 20xx" or "as of 20xx" stamp. The check names its
# exclusions (historical records and generated files) and gives each one a reason. On
# 2026-10-20 init.md held 22 dead paths, 2 missing mart objects and 5 stamps, and no check saw it.
# `common/runtime/src/truealpha_tools/doc_drift.py` is the check; its docstring states the rules.
#
# A red run is the verdict. It gates no merge, it is not a required check, and it opens no
# issue (ADR A8). It reads main's tree, not a deployed release: agents and people read the
# documents on main, and the data-engine image holds no Markdown and no git tree.
# scheduler-liveness watches this schedule. Manual replay: workflow_dispatch, or run the same
# command in a checkout.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Standard library only: no install step.
      - name: Doc drift on main
        run: python3 common/runtime/src/truealpha_tools/doc_drift.py --ref HEAD
