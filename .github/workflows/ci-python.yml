name: ci-python

# #855 A4: `dagster-code-server-liveness` below is gated by `inputs.dagster_liveness_required`
# (set by ci-required.yml's `python` job). nightly-dagster-liveness.yml calls this workflow
# with `dagster_liveness_only: true` instead: the liveness job runs and the other three skip —
# the nightly exists only to give the probe a run independent of any one PR's diff, not to
# re-run the whole suite on a timer. Both are explicit inputs rather than a read of
# `github.event_name`: inside a reusable workflow that context is the CALLER's, which is easy
# to misread and shifts if a caller is added. This file stays `workflow_call`-only: GitHub
# creates no run at all for a PR whose reusable workflow also declares its own triggers and
# permissions (#878's first push got no ci-required run).
on:
  workflow_call:
    inputs:
      dagster_liveness_required:
        description: >-
          Whether the caller wants dagster-code-server-liveness to run. ci-required.yml
          passes true unconditionally off `pull_request` (a push to main, `merge_group`,
          `workflow_dispatch`) and on a PR only when its narrow `dagster_liveness` path
          filter matched. nightly-dagster-liveness.yml passes true on its `schedule`.
        required: false
        type: boolean
        default: false
      dagster_liveness_only:
        description: >-
          Run ONLY dagster-code-server-liveness (gates and both test lanes skip). Set by
          nightly-dagster-liveness.yml; the liveness job treats it as `required` too.
        required: false
        type: boolean
        default: false


jobs:
  # A4 D3 (#673): one serial `check` job measured 259 s — lint, types, four tool
  # gates and every package's tests end to end. Split so the wall clock is the
  # slowest member, not the sum: gates ~60 s, core tests ~40 s, data-engine
  # ~150 s (the pole). Same commands, same env, nothing dropped — the split is
  # topology only. The MinIO step is duplicated into both test jobs deliberately:
  # a composite action would dedupe it at the cost of one more indirection layer.
  # The migration step is NOT duplicated in any meaningful sense any more — both
  # jobs run db/apply_migrations.sh, the one applier every call site shares (#984).
  gates:
    # The nightly `schedule` trigger exists only to re-run dagster-code-server-liveness
    # (#855 A4); it is not a standing nightly re-proof of the rest of the suite.
    if: ${{ !inputs.dagster_liveness_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # #463 route-namespace manifest (llm-service side; ci-web runs the same
      # check for app-web). Stdlib-only.
      - run: python3 tools/check_route_manifest.py
      # #284: the factor surface is frozen — public signatures (defaults included) and
      # the datahub columns factors read. Stdlib only, no database, so it runs here.
      - run: python3 tools/check_factor_contract.py
      - run: python3 tools/reachability_ratchet.py --check
      - run: python3 tools/sql_literal_gate.py
      - run: uv run ruff check apps libs
      - run: uv run ruff format --check apps libs
      - run: uv run mypy
      - run: uv run python libs/contracts/conformance/export_issue58.py --check
      # #759 environment manifests: fresh against the settings models and past the
      # infra2-sdk offline gate. No infrastructure involved.
      - run: uv run python tools/env_manifest.py --check

  test-core:
    if: ${{ !inputs.dagster_liveness_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres + MinIO so the KG / raw-store / ledger integration tests run
    # in CI instead of skipping (they skip gracefully where unreachable).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # A docker-run step rather than a service container: GitHub services can't
      # override the container command, and the official minio image (the same
      # pin docker-compose.yml uses) needs `server /data`.
      #
      # #823 pinned quay.io by digest after Docker Hub's minio/minio 404'd (2026-09-15):
      # "the digest makes the reference immutable whatever a registry does next" -- true of
      # the bytes, not of MinIO's willingness to serve them. #1041 (2026-09-24): MinIO
      # discontinued free/anonymous distribution entirely (quay.io now requires auth even
      # to list tags, Docker Hub's repo and Bitnami's mirror are gone, dl.min.io returns
      # "410 Gone: ... archived and no longer maintained"). This pin builds the same
      # AGPLv3-licensed release from MinIO's still-public GitHub source once
      # (.github/workflows/mirror-minio.yml) and publishes it to this repo's own GHCR, so
      # the reference no longer depends on a vendor's distribution decision.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio_local_secret \
            ghcr.io/wangzitian0/minio-mirror@sha256:986342c576435342b38fa75d14ed2bb63831242f37907fd1c83239631f9c5b80 server /data
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            echo "Waiting for MinIO ($attempt/30)"
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1
      - name: Apply the migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      - run: uv run pytest libs/contracts/tests libs/factors/tests libs/runtime/tests apps/llm-service/tests
        env:
          APP_ENV: ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_local_secret
          S3_BUCKET: truealpha-raw
          # The services above exist so integration tests RUN here; a suite
          # that silently skips must fail, not pass green while covering nothing.
          TRUEALPHA_REQUIRE_RUNTIME: "1"

  # A4 B1 (#673): this was ONE 207 s job — 168 s of pytest — and the pole of
  # every PR's CI wall (run 33361977933; next-slowest job 163 s). The tree has
  # no conftest.py and every fixture is defined in the file that uses it, so it
  # shards without coupling. tools/pytest_shard.py owns the partition and
  # libs/runtime/tests/test_pytest_shard.py proves it covers the tree exactly;
  # a per-directory list here would rot the first time a directory is added.
  # fail-fast is off so one red shard does not hide the other two.
  #
  # The lane count lives in ONE place: the matrix. --shard/--of come from
  # strategy.job-index/job-total, so `--of` cannot drift out of step with the
  # matrix length. It could before: two independent literals, and raising only
  # `--of` to 4 would leave every file at position 4k+3 assigned to a shard
  # nobody runs — green, forever, which is the exact green-while-empty shape
  # (#527) this whole job exists to avoid.
  test-data-engine:
    if: ${{ !inputs.dagster_liveness_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio_local_secret \
            ghcr.io/wangzitian0/minio-mirror@sha256:986342c576435342b38fa75d14ed2bb63831242f37907fd1c83239631f9c5b80 server /data
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            echo "Waiting for MinIO ($attempt/30)"
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1
      - name: Apply the migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      - name: Run tests (shard ${{ matrix.shard }} of 3)
        run: |
          set -euo pipefail
          # Command substitution, NOT `mapfile < <(...)`: a process
          # substitution's exit status is invisible to both `set -e` and
          # pipefail, so a failing shard tool would leave FILES empty and
          # `pytest "${FILES[@]}"` would expand to bare `pytest` — which falls
          # back to pyproject's testpaths and runs the WHOLE suite in a lane
          # named for one shard. The count check is the second layer.
          FILE_LIST=$(python3 tools/pytest_shard.py apps/data-engine/tests --shard ${{ strategy.job-index }} --of ${{ strategy.job-total }})
          mapfile -t FILES <<< "$FILE_LIST"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} selected no files — refusing to run bare pytest"
            exit 1
          fi
          echo "shard ${{ matrix.shard }}: ${#FILES[@]} files"
          # --durations-min=0 as well as --durations=0: the min defaults to 5 ms,
          # so an all-fast file prints NOTHING and a harvest cannot tell it from a
          # file that did not exist yet. Both are log lines only, no time cost, and
          # keeping them on means ANY green run can refresh the shard weights —
          # which is what keeps them from going stale.
          uv run pytest "${FILES[@]}" --durations=0 --durations-min=0
        env:
          APP_ENV: ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_local_secret
          S3_BUCKET: truealpha-raw
          TRUEALPHA_REQUIRE_RUNTIME: "1"

  # truealpha#454: dagster-webserver/dagster-daemon under `-m data_engine.dagster_defs`
  # each spawn and heartbeat-manage their own local code-server subprocess with a
  # hardcoded 20s TTL (dagster._daemon.controller.DAEMON_GRPC_SERVER_HEARTBEAT_TTL) --
  # unreliable heartbeat delivery made it self-terminate and respawn every ~68-70s on
  # staging. The fix (infra2 PR #573) points the daemon at a *persistent* code-server
  # via `--grpc-socket` instead. This job proves that behavior directly -- no Traefik,
  # Vault, or Dokploy involved, just truealpha's own dagster_defs.py against a real
  # Postgres -- instead of only being verifiable by SSHing into staging after a deploy
  # (reproduced locally in the same shape before adding this: 0 heartbeat warnings over
  # 120s with --grpc-socket, vs. one every ~68-70s under plain `-m`).
  #
  # #855 A4: this job was 151-160s (now ~110s after #871's 75s window) of every PR's
  # and every main push's critical path, for a regression class unrelated to ~95% of
  # PR diffs. It is unconditional off `pull_request` -- a push to main, `merge_group`,
  # `workflow_dispatch`, and this workflow's own nightly `schedule` -- and gated on a
  # PR by ci-required.yml's narrow `dagster_liveness` path filter (the composition
  # root, its lanes, the image, docker-compose.yml, this file). Owner-accepted trade-off
  # (2026-09-16): a green `ci-required` on a PR the filter does not match no longer
  # proves the #454 class stays fixed on THAT diff -- it proves everything ELSE, and the
  # #454 class is still caught within a day, on main or the nightly run, for every PR.
  dagster-code-server-liveness:
    if: inputs.dagster_liveness_only || inputs.dagster_liveness_required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DAGSTER_HOME: ${{ github.workspace }}/.dagster_home_ci
      DAGSTER_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/truealpha?options=-csearch_path%3Ddagster
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --package truealpha-data-engine --frozen
      - name: Apply the migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      - name: Write dagster.yaml
        run: |
          mkdir -p "$DAGSTER_HOME"
          cat > "$DAGSTER_HOME/dagster.yaml" <<'YAML'
          storage:
            postgres:
              postgres_url:
                env: DAGSTER_POSTGRES_URL
          local_artifact_storage:
            module: dagster.core.storage.root
            class: LocalArtifactStorage
            config:
              base_dir: /tmp/dagster-ci-artifacts
          telemetry:
            enabled: false
          YAML
      - name: Start persistent code-server + daemon over --grpc-socket
        run: |
          SOCK=/tmp/ta-code-server.sock
          uv run --package truealpha-data-engine dagster api grpc \
            -m data_engine.dagster_defs --socket "$SOCK" --lazy-load-user-code \
            --location-name data_engine.dagster_defs --log-level debug \
            > code_server.log 2>&1 &
          echo "CODE_SERVER_PID=$!" >> "$GITHUB_ENV"
          # An explicit failure, not a fall-through: the loop's `break` is the
          # only success path, so 30 fruitless attempts used to start the daemon
          # anyway and let this job fail 75s later inside the churn assertion --
          # a socket that never came up reported as a heartbeat regression, which
          # is the wrong diagnosis for the wrong reason (review).
          ready=""
          for attempt in $(seq 1 30); do
            if uv run --package truealpha-data-engine dagster api grpc-health-check --socket "$SOCK"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::code-server never answered a health check on $SOCK after 30 attempts" >&2
            cat code_server.log >&2
            exit 1
          fi
          uv run --package truealpha-data-engine dagster-daemon run --grpc-socket "$SOCK" \
            > daemon.log 2>&1 &
          echo "DAEMON_PID=$!" >> "$GITHUB_ENV"
          echo "SOCK=$SOCK" >> "$GITHUB_ENV"
      # #860: the window is ONE full churn cycle of the old regime plus margin. Under
      # plain `-m` the code-server self-terminated every ~68-70s (the job comment
      # above, measured on staging and in the local reproduction), so if that
      # regression is back, "No heartbeat received" is in the log by ~70s of daemon
      # uptime; 75s is the far end of that cadence plus a 5-7s margin. The first
      # version slept 120s -- also "over one cycle", as its own name said, not two;
      # the extra 50s was margin nobody had sized, and it made this job the pole of
      # every PR's and every main push's critical path at 2.5 min (runs 35051480691,
      # 35051670287). If the cadence is ever re-measured longer, raise this number
      # and the comment above together: test_ci_workflows.py holds the window above
      # the cadence the job documents, and refuses a drift back toward two cycles.
      - name: Observe for 75s (one full old ~68-70s churn cycle, plus margin) and assert no heartbeat churn
        run: |
          sleep 75
          echo "--- code_server.log ---"
          cat code_server.log
          if grep -q "No heartbeat received" code_server.log; then
            echo "::error::code-server self-terminated on a missing heartbeat -- --grpc-socket regressed to per-role managed spawning" >&2
            exit 1
          fi
      - name: Positive health checks
        run: |
          uv run --package truealpha-data-engine dagster api grpc-health-check --socket "$SOCK"
          uv run --package truealpha-data-engine dagster-daemon liveness-check
      - name: Stop background processes
        if: always()
        run: |
          kill "$DAEMON_PID" "$CODE_SERVER_PID" 2>/dev/null || true
