name: ci-python

on:
  workflow_call:
    inputs:
      dagster_liveness_required:
        description: >-
          Whether the caller wants dagster-code-server-liveness to run. ci-required.yml
          passes true unconditionally off `pull_request` (a push to main, `merge_group`,
          `workflow_dispatch`) and on a PR only when its narrow `dagster_liveness` path
          filter matched.
        required: false
        type: boolean
        default: false
      data_engine_required:
        description: >-
          Whether data-engine test shards must run. Defaults to true.
        required: false
        type: boolean
        default: true


env:
  S3_CORE_TEST_FILES: >-
    common/runtime/tests/test_runtime.py
    apps/llm-service/tests/smoke/test_library_s3_smoke.py
    apps/llm-service/tests/test_boot.py
  S3_DATA_ENGINE_TEST_FILES: >-
    apps/data-engine/tests/test_raw_store.py

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # #284: the factor surface is frozen — public signatures (defaults included) and
      # the datahub columns factors read. Stdlib only, no database, so it runs here.
      - run: python3 tools/check_factor_contract.py
      - run: make lint
      - run: make typecheck-python
      - run: make contract-conformance
      # #759 environment manifests & hooks: validated directly via infra2_sdk.manifests.
      - run: |
          uv run python -c '
          from pathlib import Path
          from infra2_sdk import manifests
          specs = (
              manifests.ManifestSpec("apps/data-engine/required-env.generated.json", "data_engine.config:Settings", source="apps/data-engine"),
              manifests.ManifestSpec("apps/llm-service/required-env.generated.json", "llm_service.config:Settings", source="apps/llm-service"),
          )
          raise SystemExit(manifests.main(["--check"], root=Path("."), specs=specs, hand_written=("apps/app-web/required-env.manifest.json",)))
          '
          uv run python -m infra2_sdk.manifests --check-hooks runtime-hooks.manifest.json

  test-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # The compose `s3` service is the one pin of the local and CI S3 engine (RustFS, the
      # engine of the infra2 platform service). `--wait` blocks on its healthcheck.
      - name: Start S3
        run: docker compose up -d --wait s3 || { docker compose logs s3; exit 1; }
      - name: Apply the migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      - name: Run S3 tests
        run: |
          set -euo pipefail
          S3_LIST="$S3_CORE_TEST_FILES"
          if [ "${{ inputs.data_engine_required }}" = "true" ]; then
            S3_LIST="$S3_LIST $S3_DATA_ENGINE_TEST_FILES"
          fi
          read -r -a FILES <<< "$S3_LIST"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::test-s3 selected no files — refusing to run bare pytest"
            exit 1
          fi
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::declared S3 test file does not exist: $f"
              exit 1
            fi
          done
          echo "test-s3: ${#FILES[@]} files"
          # #1412 L1: through the make target; FILES is the explicit S3 set.
          PYTEST_ADDOPTS="--durations=0 --durations-min=0" make test-python FILES="${FILES[*]}"
        env:
          ENVIRONMENT: ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: s3local
          S3_SECRET_KEY: s3_local_secret
          S3_BUCKET: truealpha-raw
          TRUEALPHA_REQUIRE_RUNTIME: "1"

  # Run all non-S3 gate/deps/smoke/contract tests across deterministic index-strided shards.
  # fail-fast is off so one red shard does not hide the other lane. Postgres 16 only (no S3 startup).
  test-deps-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Apply the migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      - name: Run tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: |
          set -euo pipefail
          # Command substitution, NOT `mapfile < <(...)`: a process substitution's exit status
          # is invisible to `set -e` and pipefail. The count check is the second guard against bare pytest.
          FILE_LIST=$(python3 -c '
          import os, pathlib
          idx, tot = ${{ strategy.job-index }}, ${{ strategy.job-total }}
          roots = ["common/contracts/tests", "common/factors/tests", "common/runtime/tests", "apps/llm-service/tests"]
          if os.environ.get("DATA_ENGINE_REQUIRED", "").lower() == "true":
              roots.append("apps/data-engine/tests")
          s3_files = {pathlib.Path(p) for p in (os.environ.get("S3_CORE_TEST_FILES", "") + " " + os.environ.get("S3_DATA_ENGINE_TEST_FILES", "")).split()}
          files = sorted({p for r in roots for pat in ("test_*.py", "*_test.py") for p in pathlib.Path(r).rglob(pat)} - s3_files)
          print("\n".join(str(p) for p in files[idx::tot]))
          ')
          mapfile -t FILES <<< "$FILE_LIST"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} selected no files — refusing to run bare pytest"
            exit 1
          fi
          echo "shard ${{ matrix.shard }}: ${#FILES[@]} files"
          # #1412 L1: through the make target; FILES is this shard.
          PYTEST_ADDOPTS="--durations=0 --durations-min=0" make test-python FILES="${FILES[*]}"
        env:
          ENVIRONMENT: ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
          DATA_ENGINE_REQUIRED: ${{ inputs.data_engine_required }}
          TRUEALPHA_REQUIRE_RUNTIME: "1"

  # truealpha#454: dagster-webserver/dagster-daemon under `-m data_engine.dagster_defs`
  # each spawn and heartbeat-manage their own local code-server subprocess with a
  # hardcoded 20s TTL (dagster._daemon.controller.DAEMON_GRPC_SERVER_HEARTBEAT_TTL) --
  # unreliable heartbeat delivery made it self-terminate and respawn every ~68-70s on
  # staging. The fix (infra2 PR #573) points the daemon at a *persistent* code-server
  # via `--grpc-socket` instead. This job proves that behavior directly -- no Traefik,
  # Vault, or Dokploy involved, just truealpha's own dagster_defs.py against a real
  # Postgres -- instead of only being verifiable by SSHing into staging after a deploy
  # (reproduced locally in the same shape before adding this: 0 heartbeat warnings over
  # 120s with --grpc-socket, vs. one every ~68-70s under plain `-m`).
  #
  # Wave 3 (< 45s startup + --grpc-socket + liveness smoke): PR CI proves persistent
  # code-server startup, `--grpc-socket` wiring (daemon does not spawn its own child
  # code server), and daemon heartbeat liveness without blocking PRs on a 75s sleep;
  # sustained runtime stability is observed on Staging dashboards. Expanded trigger filters
  # in ci-required.yml cover apps/data-engine/**, common/**, pyproject.toml, and uv.lock.
  dagster-code-server-liveness:
    if: inputs.dagster_liveness_required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truealpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DAGSTER_HOME: ${{ github.workspace }}/.dagster_home_ci
      DAGSTER_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/truealpha?options=-csearch_path%3Ddagster
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - run: uv sync --package truealpha-data-engine --frozen
      - name: Apply the migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truealpha
        run: sh db/apply_migrations.sh
      - name: Write dagster.yaml
        run: |
          mkdir -p "$DAGSTER_HOME"
          cat > "$DAGSTER_HOME/dagster.yaml" <<'YAML'
          storage:
            postgres:
              postgres_url:
                env: DAGSTER_POSTGRES_URL
          local_artifact_storage:
            module: dagster.core.storage.root
            class: LocalArtifactStorage
            config:
              base_dir: /tmp/dagster-ci-artifacts
          telemetry:
            enabled: false
          YAML
      - name: Start persistent code-server + daemon over --grpc-socket
        run: |
          SOCK=/tmp/ta-code-server.sock
          # setsid: each background process leads its own process group, so the stop step can
          # end uv AND its dagster child together (#1051 -- killing only the uv PID left both
          # alive, holding the uv cache lock that setup-uv's post-step prune then waits on).
          setsid uv run --package truealpha-data-engine dagster api grpc \
            -m data_engine.dagster_defs --socket "$SOCK" --lazy-load-user-code \
            --location-name data_engine.dagster_defs --log-level debug \
            > code_server.log 2>&1 &
          echo "CODE_SERVER_PID=$!" >> "$GITHUB_ENV"
          # An explicit failure, not a fall-through: the loop's `break` is the
          # only success path, so 30 fruitless attempts used to start the daemon
          # anyway and let this job fail 75s later inside the churn assertion --
          # a socket that never came up reported as a heartbeat regression, which
          # is the wrong diagnosis for the wrong reason (review).
          ready=""
          for attempt in $(seq 1 30); do
            if uv run --package truealpha-data-engine dagster api grpc-health-check --socket "$SOCK"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::code-server never answered a health check on $SOCK after 30 attempts" >&2
            cat code_server.log >&2
            exit 1
          fi
          setsid uv run --package truealpha-data-engine dagster-daemon run --grpc-socket "$SOCK" --code-server-log-level info \
            > daemon.log 2>&1 &
          echo "DAEMON_PID=$!" >> "$GITHUB_ENV"
          echo "SOCK=$SOCK" >> "$GITHUB_ENV"
      - name: Poll gRPC + daemon liveness and verify zero heartbeat churn
        run: |
          set -euo pipefail
          ready=""
          for _ in $(seq 1 30); do
            if uv run --package truealpha-data-engine dagster api grpc-health-check --socket "$SOCK" \
              && uv run --package truealpha-data-engine dagster-daemon liveness-check; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::dagster code-server or daemon failed liveness within 30s" >&2
            echo "--- code_server.log ---" >&2
            cat code_server.log >&2 || true
            echo "--- daemon.log ---" >&2
            cat daemon.log >&2 || true
            exit 1
          fi
          if grep -q "No heartbeat received" code_server.log; then
            echo "::error::code-server self-terminated on a missing heartbeat -- --grpc-socket regressed to per-role managed spawning" >&2
            cat code_server.log >&2
            exit 1
          fi
          if grep -q "Started Dagster code server" daemon.log; then
            echo "::error::dagster-daemon spawned its own code server instead of using --grpc-socket" >&2
            cat daemon.log >&2
            exit 1
          fi
      - name: Stop background processes
        if: always()
        run: |
          # Direct process signaling by command line: setsid causes $! to capture the exited
          # parent PID, so kill -TERM -- "-$pid" fails silently. pkill signals the active daemons immediately.
          for pid in "${DAEMON_PID:-}" "${CODE_SERVER_PID:-}"; do
            [ -n "$pid" ] && kill -TERM -- "-$pid" 2>/dev/null || true
          done
          pkill -TERM -f "dagster api grpc|dagster-daemon run" || true
          for _ in $(seq 1 5); do
            pgrep -f "dagster api grpc|dagster-daemon run" >/dev/null || break
            sleep 1
          done
          pkill -KILL -f "dagster api grpc|dagster-daemon run" || true
          for pid in "${DAEMON_PID:-}" "${CODE_SERVER_PID:-}"; do
            [ -n "$pid" ] && kill -KILL -- "-$pid" 2>/dev/null || true
          done
          sleep 1
          # A survivor keeps the uv cache lock and stalls setup-uv's post-step prune (#1051):
          # fail here, naming it, instead of five minutes later inside the prune.
          if pgrep -af "dagster api grpc|dagster-daemon run"; then
            echo "::error::dagster processes survived the stop step (see above)" >&2
            exit 1
          fi
