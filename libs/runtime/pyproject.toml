[project]
name = "truealpha-runtime"
version = "0.1.0"
description = "Runtime dependency, configuration, health, and object-storage boundary for TrueAlpha."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.2.0",
    "truealpha-contracts",
    # S3RawObjectStore's client construction (bucket/endpoint/credential validation)
    # via infra2_sdk.runtime.s3 — boto3 above already satisfies its optional-dependency
    # check, no extras needed.
    "infra2-sdk @ https://github.com/wangzitian0/infra2-sdk/releases/download/v1.0.0/infra2_sdk-1.0.0-py3-none-any.whl",
]

[project.scripts]
truealpha-runtime = "truealpha_runtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
truealpha-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# infra2-sdk above is a direct URL reference (the immutable release wheel, matching
# every other infra2-sdk consumer in this repo), which hatchling otherwise rejects.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/truealpha_runtime"]
