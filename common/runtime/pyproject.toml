[project]
name = "truealpha-runtime"
version = "0.1.0"
description = "Runtime dependency, configuration, health, and object-storage boundary for TrueAlpha."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.2.0",
    "truealpha-contracts",
    # S3RawObjectStore's client construction (bucket/endpoint/credential validation)
    # via infra2_sdk.storage — boto3 above already satisfies its optional-dependency
    # check. The `telemetry` extra is the OTLP/HTTP exporter stack of infra2_sdk.telemetry
    # (#1034); it ships in every service image because every Python service starts
    # telemetry through it (init_service or init_worker).
    "infra2-sdk[http,telemetry,llm] @ https://github.com/wangzitian0/infra2-sdk/releases/download/v4.11.2/infra2_sdk-4.11.2-py3-none-any.whl",
]

[project.scripts]
truealpha-runtime = "truealpha_runtime.cli:main"
truealpha-backtest-trigger = "truealpha_tools.backtest_trigger:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    # tests/workflow_contract.py parses .github/workflows. Declared rather than
    # relied on transitively: `uv sync --package truealpha-runtime` in isolation
    # would otherwise collect nothing (review, #583).
    "pyyaml>=6.0",
]

[tool.uv.sources]
truealpha-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# infra2-sdk above is a direct URL reference (the immutable release wheel),
# which hatchling otherwise rejects.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/truealpha_runtime", "src/truealpha_tools"]
