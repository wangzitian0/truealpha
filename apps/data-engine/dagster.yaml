# Dagster instance config for the deployed Staging/Production daemon + webserver
# (infra2 truealpha/truealpha/20.data_engine/compose.yaml). DAGSTER_HOME points
# here (an image path, /opt/dagster) rather than the mounted data volume so this
# file is not shadowed by the empty /var/lib/dagster mount at runtime.
#
# Run/event/schedule storage all resolve to the environment's Postgres `dagster`
# schema through DAGSTER_POSTGRES_URL, which the entrypoint derives from
# DATABASE_URL as `${DATABASE_URL}?options=-csearch_path%3Ddagster`. Persisting
# schedule state in Postgres is what makes the daemon the single durable
# recurring-run authority (#27), rather than ephemeral per-container state.
storage:
  postgres:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

# Compute logs and other run artifacts land on the persistent data volume the
# compose mounts at /var/lib/dagster (${DATA_PATH}), so they survive redeploys.
local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /var/lib/dagster

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/lib/dagster/compute_logs

# No anonymous phone-home from a bounded, isolated canary stack.
telemetry:
  enabled: false

# Run launcher (#1442). Each run is a child process of the code server, and a container
# restart kills it. MonitoredRunLauncher asks the code server whether it still executes a
# STARTED run, so the run monitor marks a lost run failed at its next poll. It also writes
# each job's maximum runtime, derived from measured run times in the environment contract,
# to the run tag dagster/max_runtime.
run_launcher:
  module: data_engine.run_launcher
  class: MonitoredRunLauncher

# Run monitoring (#1271, #1442). The daemon checks every STARTED run each poll_interval_seconds.
# It fails a run whose worker is lost, and a run past its dagster/max_runtime tag.
# max_runtime_seconds bounds only a run without that tag: a run of a job that the environment
# contract lists as unmeasured or does not list, and a run launched before this launcher.
# test_dagster_instance_config.py holds it above the margin times every measured success.
# Dagster 1.13 keeps run monitoring off and the limit at 0 (no limit) unless this block sets them.
run_monitoring:
  enabled: true
  poll_interval_seconds: 120
  max_runtime_seconds: 10800

# Run queue (#1467). The gRPC server and every run process share the memory of the code server
# container. Dagster admits its own default number of runs when this block is absent, and the
# default executor started one process per step. Together they exceeded the ceiling of staging:
# the kernel killed the container and every run in it stayed STARTED. Every job now uses the
# in-process executor (data_engine.dagster_defs), so a run is one process.
# The two numbers below are a projection of `code_server_capacity` in environment_contract.v1.json,
# which holds the ceiling, the utilization limit, the size of the server and the number of slots.
# The memory left beside the server, divided over the slots, is the budget of one run. The nightly
# verdict runtime_shape compares every run process with that budget.
# test_run_capacity.py holds this file equal to the contract.
# A job that waits for other runs (tag truealpha/waits_for_runs) holds a slot while it waits.
# The tag limit is one below max_concurrent_runs, so the waiting runs never hold every slot.
# A run that does not wait always holds one slot, finishes, and passes it to the next queued run.
# The queue does not start a run that exceeds a limit and starts the next one.
run_queue:
  max_concurrent_runs: 2
  tag_concurrency_limits:
    - key: truealpha/waits_for_runs
      value: "true"
      limit: 1

# Tick retention (#1072). Three sensors poll every 30 seconds. Each poll that does no work
# writes a SKIPPED tick to dagster.job_ticks. Dagster keeps SKIPPED sensor ticks for 7 days
# by default. Here they expire after 3 days. The other statuses stay for ever (-1), so
# every tick that did work or failed remains. Schedule ticks keep the Dagster defaults.
# The daemon deletes expired ticks after each sensor tick.
retention:
  sensor:
    purge_after_days:
      skipped: 3
      started: -1
      success: -1
      failure: -1
